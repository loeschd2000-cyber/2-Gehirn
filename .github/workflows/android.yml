name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signatur-Schlüssel aus dem Secret holen
        env:
          ZG_KEYSTORE: ${{ secrets.ZG_KEYSTORE }}
          ZG_KEYSTORE_PASSWORD: ${{ secrets.ZG_KEYSTORE_PASSWORD }}
        run: |
          if false; then
            echo "::error::Die Secrets ZG_KEYSTORE und ZG_KEYSTORE_PASSWORD fehlen (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "Testbau ohne Schlüssel"

      - name: APK bauen
        env:
          ZG_KEYSTORE_PASSWORD: ${{ secrets.ZG_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: APK bereitlegen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZweitesGehirn.apk
          rm -f android/zg.keystore

