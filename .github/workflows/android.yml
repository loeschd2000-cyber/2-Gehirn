name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signatur-Schlüssel aus dem Secret holen
        env:
          ZG_KEYSTORE: ${{ secrets.ZG_KEYSTORE }}
          ZG_KEYSTORE_PASSWORD: ${{ secrets.ZG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ZG_KEYSTORE" ] || [ -z "$ZG_KEYSTORE_PASSWORD" ]; then
            echo "::error::Die Secrets ZG_KEYSTORE und ZG_KEYSTORE_PASSWORD fehlen (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$ZG_KEYSTORE" | base64 -d > android/zg.keystore

      - name: APK bauen
        env:
          ZG_KEYSTORE_PASSWORD: ${{ secrets.ZG_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle -p android assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            # Fehler als Hinweise anzeigen (sieht man dann direkt in der Übersicht)
            grep -E "^e: |error:|What went wrong|Could not " build.log | head -20 | sed 's/^/::error::/'
            exit 1
          }

      - name: APK bereitlegen
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ZweitesGehirn.apk
          rm -f android/zg.keystore

      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app ZweitesGehirn.apk \
            --title "Zweites Gehirn – Android-App (Version 1.${{ github.run_number }})" \
            --notes "Automatisch gebaut. Auf dem Handy herunterladen und installieren. Neue Versionen lassen sich einfach drüber installieren." \
            --latest
