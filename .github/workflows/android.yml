name: Android-App bauen

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK bauen
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: APK bereitlegen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ZweitesGehirn.apk

      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app ZweitesGehirn.apk \
            --title "Zweites Gehirn – Android-App (Version 1.${{ github.run_number }})" \
            --notes "Automatisch gebaut. Auf dem Handy herunterladen und installieren. Neue Versionen lassen sich einfach drüber installieren." \
            --latest
