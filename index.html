<title>Zweites Gehirn</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#02060d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* J.A.R.V.I.S.-Kommandozentrale. Bewusst immer dunkel. Die Farbe folgt dem Zustand:
     bereit = Cyan, hört zu = Grün, denkt nach = Bernstein, spricht = helles Cyan. */
  :root {
    --bg: #02060d;
    --bg-2: #061221;
    --glass: rgba(9, 24, 42, .55);
    --glass-2: rgba(14, 36, 62, .55);
    --glass-hi: rgba(20, 52, 86, .7);
    --line: rgba(90, 190, 240, .16);
    --line-2: rgba(90, 200, 255, .3);
    --line-hi: rgba(110, 220, 255, .6);
    --ink: #e6f6ff;
    --ink-2: #b6d3e6;
    --muted: #6f93ab;
    --acc: 63, 214, 255;
    --a: rgb(var(--acc));
    --a-soft: rgba(var(--acc), .12);
    --a-glow: rgba(var(--acc), .45);
    --ok: #3ee89a; --warn: #ffb547; --bad: #ff5f6d;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    --r: 18px;
    color-scheme: dark;
  }
  body[data-st="listen"] { --acc: 70, 245, 170; }
  body[data-st="think"]  { --acc: 255, 190, 80; }
  body[data-st="speak"]  { --acc: 120, 228, 255; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; overflow: hidden;
    background:
      radial-gradient(900px 600px at 50% 30%, rgba(var(--acc), .10), transparent 65%),
      radial-gradient(700px 500px at 100% 100%, rgba(40, 90, 170, .16), transparent 60%),
      radial-gradient(600px 500px at 0% 0%, rgba(20, 80, 140, .14), transparent 60%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    transition: background .8s;
  }
  /* feines Raster + Scan-Linie */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: linear-gradient(rgba(90,190,240,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(90,190,240,.07) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
  }
  body::after {
    content: ""; position: fixed; left: 0; right: 0; top: -30%; height: 30%; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, transparent, rgba(var(--acc), .05), transparent);
    animation: scan 9s linear infinite;
  }
  @keyframes scan { to { transform: translateY(440%); } }

  .app {
    position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; gap: 14px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: 1500px; margin: 0 auto;
  }

  /* ---------- Kopfzeile ---------- */
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; flex: none; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 42px; height: 42px; flex: none; position: relative; }
  .mark svg { width: 100%; height: 100%; overflow: visible; }
  .mark .spin { transform-origin: 50% 50%; animation: spin 12s linear infinite; }
  .mark .spin2 { transform-origin: 50% 50%; animation: spin 7s linear infinite reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand b { font-family: var(--display); font-size: 19px; font-weight: 700; letter-spacing: .26em; display: block; line-height: 1.1;
    background: linear-gradient(90deg, #fff, var(--a)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand small { font-family: var(--display); font-size: 10.5px; letter-spacing: .34em; color: var(--muted); text-transform: uppercase; display: block; margin-top: 3px; }
  .clock { text-align: center; }
  .clock .t { font-family: var(--display); font-size: 30px; font-weight: 600; color: var(--ink); letter-spacing: .08em; font-variant-numeric: tabular-nums; line-height: 1.05; text-shadow: 0 0 22px var(--a-glow); }
  .clock .d { font-size: 12px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-family: var(--display); }
  .top-right { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
  .pill { font-family: var(--display); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 13px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .ibtn { width: 40px; height: 40px; border-radius: 12px; display: none; place-items: center; cursor: pointer; border: 1px solid var(--line-2); background: var(--glass); color: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); flex: none; }
  .ibtn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .ibtn:active { transform: scale(.94); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; position: relative; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 10px var(--bad); }
  .dot.ok::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1px solid var(--ok); opacity: 0; animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.6); opacity: .8; } 100% { transform: scale(1.8); opacity: 0; } }

  /* ---------- Raster ---------- */
  .grid { flex: 1; display: grid; grid-template-columns: 300px minmax(0, 1fr) 310px; gap: 16px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; min-height: 0; }
  .side { overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
  .panel {
    background: linear-gradient(180deg, var(--glass-2), var(--glass)); border: 1px solid var(--line); border-radius: var(--r); padding: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); position: relative; min-width: 0;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .04);
  }
  /* HUD-Ecken */
  .panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--a); opacity: .7; pointer-events: none; transition: border-color .6s; }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: var(--r); }
  .panel::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: var(--r); }
  .panel h2 { margin: 0 0 14px; font-family: var(--display); font-size: 11.5px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
  .panel h2::before { content: ""; width: 6px; height: 6px; background: var(--a); transform: rotate(45deg); box-shadow: 0 0 8px var(--a); flex: none; }
  .panel h2 span { margin-left: auto; color: var(--a); letter-spacing: .1em; font-size: 11px; border: 1px solid var(--line-2); border-radius: 999px; padding: 1px 9px; }

  .status { display: flex; flex-direction: column; gap: 8px; }
  .srow { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(4, 14, 26, .45); border: 1px solid var(--line); }
  .srow .dot { margin-top: 7px; }
  .srow .k { font-weight: 600; font-size: 14px; font-family: var(--display); letter-spacing: .04em; }
  .srow .v { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; line-height: 1.4; }
  .srow > div { min-width: 0; flex: 1; }
  select { width: 100%; margin-top: 6px; background: #06121f; color: var(--ink); border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }

  .cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cmd { font: inherit; font-size: 13.5px; color: var(--ink); text-align: left; cursor: pointer; background: rgba(4, 14, 26, .45); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; transition: border-color .2s, background .2s, transform .1s; min-width: 0; }
  .cmd:hover { border-color: var(--line-hi); background: var(--a-soft); }
  .cmd:active { transform: scale(.97); }
  .cmd em { font-style: normal; color: var(--a); font-family: var(--display); font-size: 12px; letter-spacing: .12em; font-weight: 600; }
  .cmd.wide { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; align-items: center; }
  .cmd.alert { border-color: rgba(255, 181, 71, .6); }
  .cmd.alert em { color: var(--warn); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--a); outline-offset: 2px; }

  .gsetup { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px dashed var(--line-hi); }
  .gsetup label { font-size: 12px; color: var(--muted); }
  .gsetup input { background: #06121f; color: var(--ink); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 13px; min-width: 0; }
  .gsetup .row { display: flex; gap: 8px; }
  .gsetup .row button { flex: 1; align-items: center; }

  /* ---------- Kern ---------- */
  .core { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 10px 18px 16px; overflow: hidden; }
  .orbwrap { position: relative; height: clamp(190px, 34vh, 360px); flex: none; transition: height .5s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
  .core.chatting .orbwrap { height: clamp(150px, 24vh, 260px); }
  canvas { width: 100%; height: 100%; display: block; }
  .orblabel { display: none; }
  .state { font-family: var(--display); font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--a); text-align: center; min-height: 20px; margin-top: -6px; text-shadow: 0 0 12px var(--a-glow); transition: color .5s; flex: none; }
  .state::before, .state::after { content: "—"; opacity: .45; margin: 0 .8em; letter-spacing: 0; }

  .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 4px 8px; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
    mask-image: linear-gradient(transparent, #000 18px); -webkit-mask-image: linear-gradient(transparent, #000 18px); }
  .msg { max-width: min(640px, 86%); padding: 11px 16px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; animation: rise .35s cubic-bezier(.2,.8,.2,1); font-size: 15.5px; line-height: 1.5; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .msg.me { align-self: flex-end; background: linear-gradient(135deg, rgba(63, 214, 255, .26), rgba(40, 120, 220, .22)); border: 1px solid rgba(110, 220, 255, .35); border-bottom-right-radius: 5px; }
  .msg.ai { align-self: flex-start; background: rgba(6, 18, 32, .65); border: 1px solid var(--line); border-bottom-left-radius: 5px; position: relative; padding-left: 18px; }
  .msg.ai::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: linear-gradient(var(--a), transparent); }
  .msg.wait { color: var(--muted); }
  .msg.wait::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  .note { align-self: center; color: var(--warn); font-size: 13px; text-align: center; max-width: 90%; background: rgba(255, 181, 71, .08); border: 1px solid rgba(255, 181, 71, .25); border-radius: 999px; padding: 5px 14px; }

  .card { align-self: flex-start; max-width: min(640px, 92%); padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line-hi); background: linear-gradient(135deg, rgba(63, 214, 255, .13), rgba(20, 60, 110, .25)); display: flex; flex-direction: column; gap: 6px; animation: rise .35s; box-shadow: 0 0 30px rgba(63, 214, 255, .1); }
  .card b { font-family: var(--display); letter-spacing: .06em; }
  .card .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .card .body { white-space: pre-wrap; font-size: 14px; border-left: 2px solid var(--line-hi); padding-left: 10px; margin-block: 4px; overflow-wrap: anywhere; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  /* ---------- Start-Sequenz (Boot) ---------- */
  .boot { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at 50% 42%, #06182c, #010409 70%); display: grid; place-items: center; transition: opacity .6s ease, visibility .6s; }
  .boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .boot .ring { width: 150px; height: 150px; border-radius: 50%; position: relative; }
  .boot .ring::before, .boot .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid transparent; border-top-color: #3fd6ff; border-right-color: rgba(63,214,255,.35); animation: spin 1.1s linear infinite; box-shadow: 0 0 30px rgba(63,214,255,.25); }
  .boot .ring::after { inset: 22px; border-top-color: rgba(63,214,255,.8); border-left-color: rgba(63,214,255,.3); animation-duration: .8s; animation-direction: reverse; }
  .boot .core { position: absolute; inset: 58px; border-radius: 50%; background: radial-gradient(circle, #fff, #3fd6ff 45%, transparent 70%); animation: corePulse 1s ease-in-out infinite; }
  @keyframes corePulse { 50% { transform: scale(1.25); opacity: .7; } }
  .boot .txt { margin-top: 28px; font-family: var(--display); letter-spacing: .38em; color: #bff3ff; font-size: 15px; text-align: center; text-shadow: 0 0 14px rgba(63,214,255,.7); }
  .boot .lines { margin-top: 12px; font: 12px/1.7 ui-monospace, monospace; color: var(--muted); min-height: 90px; text-align: left; width: 250px; }
  .boot .lines div { opacity: 0; animation: lineIn .25s forwards; }
  .boot .lines div b { color: var(--ok); font-weight: 600; }
  @keyframes lineIn { to { opacity: 1; } }
  .boot .bar { width: 250px; height: 3px; background: rgba(63,214,255,.12); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .boot .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1a95bd, #bff3ff); box-shadow: 0 0 10px #3fd6ff; transition: width .25s; }

  /* ---------- Schwebende Partikel im Hintergrund ---------- */
  .motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .motes i { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; background: rgba(var(--acc), .8); box-shadow: 0 0 8px rgba(var(--acc), .9); animation: rise-up linear infinite; opacity: 0; }
  @keyframes rise-up { 0% { transform: translateY(0) translateX(0); opacity: 0; } 10% { opacity: .8; } 90% { opacity: .5; } 100% { transform: translateY(-110vh) translateX(30px); opacity: 0; } }

  /* Tagebuch-Modus: warmes Licht + Hinweis */
  body.diary { --acc: 255, 170, 120; }
  body.diary .state::after { content: "📔 Tagebuch – sag „fertig“"; display: block; margin: 4px 0 0; letter-spacing: .12em; opacity: .9; font-size: 11px; }

  /* ---------- Info-Kacheln auf dem Startbildschirm ---------- */
  .tiles { display: flex; gap: 10px; overflow-x: auto; padding: 6px 2px 10px; scrollbar-width: none; flex: none; scroll-snap-type: x mandatory; }
  .tiles::-webkit-scrollbar { display: none; }
  .tiles:empty { display: none; }
  .tile { flex: none; min-width: 124px; scroll-snap-align: start; text-align: left; font: inherit; color: var(--ink); cursor: pointer; padding: 9px 13px; border-radius: 16px; position: relative; overflow: hidden;
    background: linear-gradient(145deg, rgba(20, 52, 86, .55), rgba(6, 18, 32, .75)); border: 1px solid var(--line-2); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 8px 22px rgba(0,0,0,.35); animation: rise .5s both; }
  .tile::after { content: ""; position: absolute; top: 0; left: -60%; width: 40%; height: 100%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.07), transparent); animation: shine 6s ease-in-out infinite; }
  @keyframes shine { 0%, 70% { left: -60%; } 100% { left: 130%; } }
  .tile small { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .tile small::before { content: attr(data-ic); font-size: 13px; letter-spacing: 0; filter: saturate(.8); }
  .tile b { display: block; font-family: var(--display); font-size: 18px; white-space: nowrap; font-weight: 600; margin-top: 2px; letter-spacing: .02em; text-shadow: 0 0 16px rgba(var(--acc), .35); }
  .tile em { display: block; font-style: normal; font-size: 12px; color: var(--ink-2); }
  .tile em.up { color: var(--ok); } .tile em.down { color: #ff8a8a; }
  .core.chatting .tiles { display: none; }

  /* Antworten „fahren“ ein */
  .msg.ai { animation: rise .35s cubic-bezier(.2,.8,.2,1), glowIn 1.2s ease-out; }
  @keyframes glowIn { from { box-shadow: 0 0 0 1px rgba(var(--acc), .5), 0 0 26px rgba(var(--acc), .35); } }

  /* Statistik-Karte */
  .card.stats-card { max-width: min(680px, 100%); width: 100%; gap: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kpi { background: rgba(2, 10, 20, .45); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
  .kpi span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-family: var(--display); }
  .kpi b { font-size: 18px; font-family: var(--display); color: var(--ink); letter-spacing: 0; }
  .chart-h { font-size: 12px; color: var(--ink-2); letter-spacing: .14em; text-transform: uppercase; font-family: var(--display); margin-top: 4px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .chart-h i { display: inline-flex; align-items: center; gap: 6px; font-style: normal; letter-spacing: .04em; text-transform: none; color: var(--ink-2); font-family: var(--body); }
  .chart-h i::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .card svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
  .chart text { fill: var(--muted); font: 17px var(--body); }
  .chart text.v { fill: var(--ink-2); }
  .chart .bar { cursor: pointer; }
  .chart .bar:hover, .chart .bar.on { filter: brightness(1.25); }
  .chart-tip { min-height: 18px; font-size: 13px; color: var(--ink); }
  .btn { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 8px 16px; border: 1px solid var(--line-hi); background: var(--glass-2); color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--a); color: #021019; border-color: transparent; box-shadow: 0 0 18px var(--a-glow); }

  /* Vorschläge */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; flex: none; justify-content: center; flex-wrap: wrap; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; border: 1px solid var(--line-2); background: var(--glass); border-radius: 999px; padding: 7px 14px; white-space: nowrap; transition: .2s; }
  .chip:hover { border-color: var(--line-hi); color: var(--ink); background: var(--a-soft); }
  .chip:active { transform: scale(.96); }
  .core.chatting .chips { display: none; }

  /* ---------- Sprech-Leiste ---------- */
  .talk { display: flex; flex-direction: column; align-items: stretch; gap: 10px; flex: none; }
  .dock { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
  .dock .l { justify-self: end; } .dock .r { justify-self: start; }
  .sbtn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 1px solid var(--line-2); background: var(--glass); color: var(--ink-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: .2s; }
  .sbtn svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .sbtn:hover, .sbtn.on { color: var(--a); border-color: var(--line-hi); }
  .sbtn:active { transform: scale(.93); }
  .mic { position: relative; width: 84px; height: 84px; border-radius: 50%; cursor: pointer; border: 0; padding: 0; background: none; color: var(--ink); font: inherit; display: grid; place-items: center; }
  .mic .ring { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, rgba(var(--acc), .55), rgba(var(--acc), .14) 60%, rgba(var(--acc), .06));
    border: 2px solid var(--a); box-shadow: 0 0 28px var(--a-glow), inset 0 0 22px rgba(var(--acc), .35); transition: .3s; }
  .mic .ring::before, .mic .ring::after { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 1px solid rgba(var(--acc), .35); }
  .mic .ring::after { inset: -18px; border-style: dashed; border-color: rgba(var(--acc), .2); animation: spin 14s linear infinite; }
  .mic svg { width: 32px; height: 32px; fill: #fff; position: relative; filter: drop-shadow(0 0 6px rgba(var(--acc), .9)); }

    const utt = {}; let voices = [], n = 0;

      cancel() { AND.ttsCancel(); },

    };
    window.__zgTTS = {
      emit(ev) {
        const u = utt[ev.id]; if (!u) return;
        if (ev.type === "start") { u.onstart && u.onstart({}); return; }
        delete utt[ev.id];
        if (ev.type === "error") { u.onerror && u.onerror({}); } else { u.onend && u.onend({}); }
      },
      voices() { try { voices = JSON.parse(AND.ttsVoices()); } catch { voices = []; } nsynth.onvoiceschanged && nsynth.onvoiceschanged(); },
    };
    try { voices = JSON.parse(AND.ttsVoices()); } catch {}

  function RULES() {

  }

  let chats = [], currentId = null, messages = [];

  let serverStore = false;

  }

  async function uploadChat(c) {

  async function initStore() {

  async function syncFromServer() {          // wenn am Handy oder PC etwas dazugekommen ist

  async function persist() {

  /* ================= Stimme (Ausgabe) ================= */
  const synth = window.speechSynthesis || null;

  function pickVoice() {
    if (!synth) return;

    updateVoiceUi();
  }
  function updateVoiceUi() {
    $("cVoiceState").textContent = voiceOn ? "AN" : "AUS";
    if (!synth) { setDot("vDot", "bad"); $("vV").textContent = "Browser kann nicht vorlesen"; return; }
    setDot("vDot", voiceOn ? "ok" : "");
    $("vV").textContent = voiceOn ? (voice ? voice.name : "Deutsche Standardstimme") : "Aus";
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; } else updateVoiceUi();

  // Text erscheint genau dann, wenn die Stimme ihn spricht
  let bubbleEl = null, shown = "", fullAnswer = "";
  function reveal(chunk) {
    if (!bubbleEl) return;
    shown += chunk;
    bubbleEl.classList.remove("wait");
    bubbleEl.textContent = shown.trim();
    log.scrollTop = log.scrollHeight;
  }
  function revealAll() {
    if (bubbleEl && fullAnswer) { shown = fullAnswer; bubbleEl.classList.remove("wait"); bubbleEl.textContent = fullAnswer.trim(); }
  }
  const voiceActive = () => !!synth && voiceOn;

  let ttsEpoch = 0;   // wird bei jedem Stoppen erhöht, damit alte Sätze nicht weiterlaufen
  function speak(text, onShow) {
    const clean = text.replace(/[*#_`>]/g, "").trim();
    if (!voiceActive() || !clean) { onShow && onShow(); return; }
    const ep = ttsEpoch;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = 1.05;
    let shownOnce = false;
    const show = () => { if (!shownOnce) { shownOnce = true; onShow && onShow(); } };
    queue++; speaking = true; refreshUi();
    u.onstart = show;
    u.onend = u.onerror = () => {
      if (ep !== ttsEpoch) return;
      show();
      queue = Math.max(0, queue - 1);
      if (!queue) pump();
      if (!queue) { speaking = false; refreshUi(); if (!busy) revealAll(); maybeListenAgain(); scheduleWake(700); }
    };
    synth.speak(u);
  }
  function hush() { ttsEpoch++; if (synth) synth.cancel(); queue = 0; speaking = false; spokenUpTo = fullAnswer.length; revealAll(); refreshUi(); }

  // Fließend sprechen: immer nur ein Stück gleichzeitig, danach alles bis dahin Fertige in einem Rutsch
  let spokenUpTo = 0, genDone = false;
  function pump() {
    if (!voiceActive() || queue > 0) return;
    const rest = fullAnswer.slice(spokenUpTo);
    if (!rest.trim()) return;
    const words = t => t.trim().split(/\s+/).filter(Boolean).length;
    let cut = -1, m;
    if (genDone) cut = rest.length;
    else {
      const re = /[.!?…:;]+["»“)]?\s+|\n+/g;
      while ((m = re.exec(rest))) cut = m.index + m[0].length;
      if (cut < 0 && spokenUpTo === 0) {
        const rc = /,\s+/g;
        while ((m = rc.exec(rest))) if (words(rest.slice(0, m.index)) >= 5) cut = m.index + m[0].length;
      }
      if (cut < 0 && words(rest) >= 25) cut = rest.trimEnd().lastIndexOf(" ") + 1;
    }
    if (cut > 0) {
      const chunk = rest.slice(0, cut);
      spokenUpTo += cut;
      speak(chunk, () => reveal(chunk));
    }
  }

  /* ================= Mikrofon (Eingabe) ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setDot("micDot", "bad"); $("micV").textContent = "Nur in Edge oder Chrome verfügbar"; }
  else setDot("micDot", "ok");

  const PAUSES = [1500, 2500, 4000];
  let pauseMs = 2500;
  { const p = +lsGet("zg_pc_pause"); if (PAUSES.includes(p)) pauseMs = p; }

  function listen(keepText) {
    if (!SR) { note("Spracheingabe geht nur in Edge oder Chrome."); return; }
    if (busy || listening) return;
    stopWake();
    hush();
    rec = new SR();
    // Am PC hört der Browser durchgehend zu, auf Android klappt das nicht zuverlässig: dort wird bei Bedarf neu gestartet
    rec.lang = "de-DE"; rec.interimResults = true; rec.continuous = !IS_ANDROID; rec.maxAlternatives = 1;
    const before = keepText ? input.value.trim() + " " : "";
    let cancelled = false, stopRequested = false, lastSpeech = Date.now(), timer = null;
    const armTimer = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { if (rec && input.value.trim()) { stopRequested = true; rec.stop(); } }, pauseMs);
    };
    rec.onresult = e => {
      let finalText = "", interim = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript;
      }
      input.value = (before + finalText + interim).replace(/\s+/g, " ").trim();
      lastSpeech = Date.now();
      armTimer();
    };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
        cancelled = true; loopOn = false; updateLoopUi();
        setDot("micDot", "bad");
        $("micV").textContent = e.error === "audio-capture" ? "Kein Mikrofon gefunden" : "Kein Zugriff aufs Mikrofon";
        note((e.error === "audio-capture"
          ? "Es wurde kein Mikrofon gefunden. Ist eins angeschlossen?"
          : e.error === "service-not-allowed"
          ? "Der Browser lässt die Spracherkennung nicht zu. Prüf in Windows: Einstellungen → Datenschutz → Spracherkennung → Online-Spracherkennung auf Ein."
          : !isSecureContext
          ? "Das Mikrofon geht nur über localhost oder die https-Adresse von Tailscale."
          : "Das Mikrofon ist blockiert. Tipp oben in der Adressleiste auf das Schloss-Symbol, stell Mikrofon auf „Zulassen“ und lade die Seite neu.")
          + " (Fehlercode: " + e.error + ")");
      } else if (e.error === "network") {
        cancelled = true; note("Die Spracherkennung braucht Internet. Prüf deine Verbindung.");
      } else if (e.error === "aborted") {
        cancelled = true;
      } else if (e.error === "no-speech") {
        cancelled = !input.value.trim();   // schon Gesagtes nicht wegwerfen
      }
    };
    rec.onend = () => {
      clearTimeout(timer);
      listening = false; rec = null; refreshUi();
      const t = input.value.trim();
      // Browser hat mitten im Satz aufgehört -> weiter zuhören (die Android-App erkennt das Satzende selbst)
      if (!AND && !cancelled && !stopRequested && t && Date.now() - lastSpeech < pauseMs) { listen(true); return; }
      if (!cancelled && t) { input.value = ""; ask(t, true); }
      else scheduleWake(400);
    };

    try { rec.start(); } catch { listening = false; refreshUi(); }
  }
  function stopListening(cancel) {

  }
  function maybeListenAgain() {

  }

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };
  micBtn.addEventListener("pointerdown", () => buzz(12));
  micBtn.onclick = () => {
    if (wakeRec) { stopWake(); listen(); return; }
    if (busy) { if (ctl) ctl.abort(); hush(); return; }
    if (speaking) { hush(); lastViaVoice = false; return; }
    if (listening) { stopListening(false); return; }
    listen();
  };
  document.addEventListener("keydown", e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (e.code === "Space" && !e.repeat && !["TEXTAREA", "INPUT", "BUTTON", "SELECT", "A"].includes(tag)) { e.preventDefault(); micBtn.click(); }
  });

  /* ================= Anzeige ================= */
  function refreshUi() {

    micBtn.classList.toggle("busy", busy || speaking);

    $("micSub").textContent = listening ? "Sprich ruhig, klick wenn du fertig bist" : busy ? "Antwort abbrechen" : speaking ? "Vorlesen beenden" : (IS_ANDROID ? "Antippen" : "Klicken oder Leertaste");
    stateEl.textContent = listening ? "Hört zu …" : busy && !speaking ? "Denkt nach …" : speaking ? "Spricht …"
      : wakeHeard ? "Ja? Ich höre …" : (wakeOn && backend && !document.hidden) ? "Wartet auf „Hey Jarvis“" : "Bereit";
    $("cNew").disabled = busy;
    document.body.dataset.st = listening ? "listen" : busy && !speaking ? "think" : speaking ? "speak" : "idle";
  }
  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls; el.textContent = text; log.append(el);
    log.scrollTop = log.scrollHeight; markChatting(); return el;
  }
  const note = t => { const l = log.lastElementChild; if (l && l.className === "note" && l.textContent === t) return l; return add("note", t); };
  function markChatting() { const c = $("core"); if (c) c.classList.toggle("chatting", log.children.length > (MINI ? 0 : 1)); }
  function renderChat() {

  }
  const fmt = ts => ts ? new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  function renderList() {

  function renderStats() {

  function newChat() {

  }


  /* ================= „Hey Jarvis“: wartet auf das Aktivierungswort, solange die App offen ist ================= */
  const WAKE_RE = /\b(?:hey|hei|hej|he|hi|hallo|ey|äh)[\s,.!]*(?:jarvis|javis|jarwis|jarvin|jervis|dschawis+|dschawiss|tscharwis|tschawis|charvis|schaffis|jarvi)\b/i;
  let wakeOn = lsGet("zg_wake") === "1", wakeRec = null, wakeHeard = false, wakeTimer = null, screenLock = null;
  function beep() {
    try {
      const a = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      if (a.state === "suspended") a.resume();
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .18);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .2);
    } catch {}
  }
  const canWake = () => wakeOn && SR && backend && !busy && !speaking && !listening && !wakeRec && !document.hidden;
  function scheduleWake(ms) { clearTimeout(wakeTimer); if (wakeOn) wakeTimer = setTimeout(startWake, ms); }
  function stopWake() {
    clearTimeout(wakeTimer);
    if (wakeRec) { const r = wakeRec; wakeRec = null; wakeHeard = false; r.onend = null; try { r.abort(); } catch {} refreshUi(); }
  }
  function startWake() {
    if (AND || !canWake()) return;
    const r = new SR(); wakeRec = r; wakeHeard = false;
    r.lang = "de-DE"; r.interimResults = true; r.continuous = !IS_ANDROID; r.maxAlternatives = 1;
    let cmd = "", t = null;
    r.onresult = e => {
      let txt = "";
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript + " ";
      const m = WAKE_RE.exec(txt);
      if (!m) return;
      if (!wakeHeard) { wakeHeard = true; beep(); refreshUi(); }
      cmd = txt.slice(m.index + m[0].length).replace(/^[\s,.!?]+/, "").trim();

    };

  }
  async function lockScreen() {

  }
  function updateWakeUi() {
    $("cWakeState").textContent = wakeOn ? "AN" : "AUS";

    refreshUi();
  }
  $("cWake").onclick = () => {
    if (AND) {   // Android-App: ein Dienst hört im Hintergrund, auch wenn die App zu ist
      wakeOn = !wakeOn; lsSet("zg_wake", wakeOn ? "1" : "0"); AND.wakeSet(wakeOn); updateWakeUi();
      if (wakeOn) { beep(); note("„Hey Jarvis“ ist an – auch im Hintergrund. Oben in der Benachrichtigungsleiste siehst du, dass die App wartet."); }
      return;
    }

  /* ---------- Kleiner Kreis: schließt sich von selbst, wenn nichts mehr passiert ---------- */
  function startMiniWatch() {
    let lastActive = Date.now(), hadTalk = false;

      const active = busy || speaking || listening || Date.now() < musicHold || diaryMode;

  async function checkPc() {

  async function checkGemini() {
    if (!geminiKey) return false;
    if (geminiModel) return true;
    try {
      const r = await fetch(`${GEM}/models?pageSize=200`, { headers: { "x-goog-api-key": geminiKey } });
      if (!r.ok) throw new Error(r.status);
      const ms = ((await r.json()).models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name);
      const ver = n => { const m = /gemini-(\d+(?:\.\d+)?)/.exec(n); return m ? parseFloat(m[1]) : 0; };
      // Reihenfolge: stabile Flash-Modelle (neueste zuerst), dann Vorschau-Versionen, dann Flash-Lite als Notlösung
      const bad = /image|tts|audio|live|embed|thinking|computer|robotics/;
      const pre = n => /preview|exp/.test(n) ? 1 : 0;
      const sortV = arr => arr.sort((a, b) => (pre(a) - pre(b)) || (ver(b) - ver(a)) || a.length - b.length);
      const flash = sortV(ms.filter(n => /flash/.test(n) && !/lite/.test(n) && !bad.test(n)));
      const lite = sortV(ms.filter(n => /flash-lite/.test(n) && !bad.test(n)));
      geminiCandidates = [...flash, ...lite];
      if (!geminiCandidates.length) geminiCandidates = ["models/gemini-flash-latest"];
      const remembered = lsGet("zg_gem_model");
      geminiModel = geminiCandidates.includes(remembered) ? remembered : geminiCandidates[0];
      return true;
    } catch { geminiModel = null; return false; }
  }

  // Nachrichten ins Gemini-Format bringen (system -> systemInstruction, assistant -> model)
  function toGemini(msgs) {
    const sys = msgs.filter(m => m.role === "system").map(m => m.content).join("\n\n");
    const contents = [];
    for (const m of msgs) {
      if (m.role === "system") continue;
      const role = m.role === "assistant" ? "model" : "user";
      const last = contents[contents.length - 1];
      if (last && last.role === role) last.parts[0].text += "\n\n" + m.content;
      else contents.push({ role, parts: [{ text: m.content }] });
    }
    while (contents.length && contents[0].role !== "user") contents.shift();
    const body = { contents };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };
    return body;
  }
  async function gemFetchOne(modelName, path, body, signal) {
    const url = `${GEM}/${modelName}:${path}`;
    const headers = { "Content-Type": "application/json", "x-goog-api-key": geminiKey };
    // zuerst mit wenig "Nachdenken" (schneller), falls das Modell das nicht kennt: ohne
    const withThink = { ...body, generationConfig: { ...(body.generationConfig || {}), thinkingConfig: { thinkingLevel: "low" } } };
    let r = await fetch(url, { method: "POST", signal, headers, body: JSON.stringify(withThink) });
    if (r.status === 400) {
      const t = await r.clone().text();
      if (/thinking/i.test(t)) r = await fetch(url, { method: "POST", signal, headers, body: JSON.stringify(body) });
    }
    return r;
  }
  // Probiert das aktuelle Modell; ist es überlastet oder das Limit erreicht, automatisch das nächste
  async function gemFetch(path, body, signal) {
    const order = [geminiModel, ...geminiCandidates.filter(m => m !== geminiModel)];
    let lastStatus = 0, lastText = "";
    for (let i = 0; i < order.length && i < 8; i++) {
      const m = order[i];
      const r = await gemFetchOne(m, path, body, signal);
      if (r.ok) {
        if (m !== geminiModel || lsGet("zg_gem_model") !== m) { geminiModel = m; lsSet("zg_gem_model", m); if (backend === "gemini") $("aiV").textContent = "Gemini (immer an) · " + m.replace("models/", ""); }
        return r;
      }
      lastStatus = r.status; lastText = await r.text();
      // Modell abgeschaltet („no longer available“ …)? Aus der Liste streichen und ein neueres nehmen
      if (/no longer available|not found|deprecated|not supported|update your code|is not available/i.test(lastText)) {
        geminiCandidates = geminiCandidates.filter(x => x !== m);
        if (lsGet("zg_gem_model") === m) lsSet("zg_gem_model", "");
        const hint = /models\/(gemini-[\w.-]+)/.exec(lastText.replace(m, ""));
        if (hint && !order.includes("models/" + hint[1])) order.splice(i + 1, 0, "models/" + hint[1]);
        if (geminiModel === m) geminiModel = order[i + 1] || null;
        continue;
      }
      const overloaded = r.status === 503 || r.status === 500 || r.status === 429 || r.status === 404 || /high demand|overloaded|unavailable/i.test(lastText);
      if (!overloaded) break;
    }
    throw new Error(gemError(lastStatus, lastText));
  }
  function gemError(status, text) {
    if (/high demand|overloaded|unavailable/i.test(text) || status === 503) return "Gemini ist gerade überlastet (alle Modelle). Versuch es in ein paar Minuten nochmal oder stell „KI-Quelle“ auf PC.";
    if (status === 429) return "Das kostenlose Gemini-Limit ist gerade erreicht. Später nochmal oder auf die PC-KI umschalten.";
    if (status === 400 && /API key/i.test(text)) return "Der Gemini-Schlüssel ist ungültig.";
    if (status === 403) return "Gemini lehnt den Schlüssel ab (403).";
    try { return JSON.parse(text).error.message; } catch { return "Gemini-Fehler " + status; }
  }

  // Antwort Stück für Stück holen; onPiece bekommt jeweils den neuen Text
  async function llmStream(msgs, onPiece, signal) {
    if (backend === "gemini") {
      const r = await gemFetch("streamGenerateContent?alt=sse", { ...toGemini(msgs), generationConfig: { temperature: 0.7, maxOutputTokens: 1024 } }, signal);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const j = JSON.parse(line.slice(5));
          const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
          const piece = parts.filter(p => !p.thought).map(p => p.text || "").join("");
          if (piece) onPiece(piece);
        }
      }
      return;
    }
    const r = await fetch(OLLAMA + "/api/chat", {
      method: "POST", signal,
      body: JSON.stringify({ model, stream: true, keep_alive: "60m", options: { num_ctx: 2048 }, messages: msgs }),
    });
    if (!r.ok) throw new Error((await r.text()) || ("Fehler " + r.status));
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        const piece = j.message && j.message.content || "";
        if (piece) onPiece(piece);
      }
    }
  }
  // Antwort als JSON (für Termine, Mails usw.)
  async function llmJson(prompt, schema) {
    if (backend === "gemini") {
      const r = await gemFetch("generateContent", {
        contents: [{ role: "user", parts: [{ text: prompt + "\n\nAntworte nur mit einem JSON-Objekt nach diesem Schema, ohne weiteren Text:\n" + JSON.stringify(schema) }] }],
        generationConfig: { temperature: 0, responseMimeType: "application/json" },
      });
      const j = await r.json();
      const txt = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).filter(p => !p.thought).map(p => p.text || "").join("");
      const m = /\{[\s\S]*\}/.exec(txt);
      return JSON.parse(m ? m[0] : txt);
    }
    const r = await fetch(OLLAMA + "/api/chat", {
      method: "POST",
      body: JSON.stringify({ model, stream: false, format: schema, keep_alive: "60m", options: { num_ctx: 2048, temperature: 0 }, messages: [{ role: "user", content: prompt }] }),
    });
    if (!r.ok) throw new Error(await r.text());
    return JSON.parse((await r.json()).message.content);
  }

  // Eine KI-Antwort erzeugen, gleichzeitig vorlesen und speichern
  async function streamReply(modelMessages) {
    const bubble = add("msg ai wait", "Denkt nach …");
    bubbleEl = bubble; shown = ""; fullAnswer = "";
    busy = true; spokenUpTo = 0; genDone = false; refreshUi();
    const saving = persist();
    ctl = new AbortController();
    let full = "";
    try {
      await llmStream(modelMessages, piece => {
        full += piece; fullAnswer = full;
        if (!voiceActive()) { bubble.classList.remove("wait"); bubble.textContent = full; log.scrollTop = log.scrollHeight; }
        genDone = false; pump();
      }, ctl.signal);
      genDone = true; pump();
    } catch (e) {
      if (e && e.name === "AbortError") { lastViaVoice = false; }
      else { lastViaVoice = false; note("Die KI hat einen Fehler gemeldet: " + (e && e.message || e)); }
      if (!full) bubble.remove(); else revealAll();
    }
    await saving;
    if (full.trim()) { messages.push({ role: "assistant", content: full.trim(), ts: Date.now() }); await persist(); }
    ctl = null; busy = false; refreshUi();
    if (!speaking) { revealAll(); maybeListenAgain(); scheduleWake(700); }
  }

  // Eine feste Antwort (ohne KI) sprechen, anzeigen und speichern
  function assistantSay(text, silent) {
    const b = add("msg ai wait", "…");
    bubbleEl = b; shown = ""; fullAnswer = text; spokenUpTo = 0; genDone = true;
    if (voiceActive() && !silent) pump(); else revealAll();
    messages.push({ role: "assistant", content: text, ts: Date.now() });
    persist();
  }

  async function ask(text, viaVoice) {
    if (!backend) await checkAi();
    lastViaVoice = viaVoice;
    hush();
    add("msg me", text);
    messages.push({ role: "user", content: text, ts: Date.now() });
    // Befehle wie Musik, Anrufen, Wecker, Wallet klappen auch ohne KI

    if (!backend) { note("Keine KI erreichbar. Tipp links auf „KI-Quelle“ oder starte den PC."); return; }
    const ctx = messages.slice(-10).map(m => ({ role: m.role, content: m.content }));
    await streamReply([{ role: "system", content: RULES() }, ...ctx]);
  }

  function loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();

      sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;

  function tokenReceived(tok, seconds) {
    gToken = tok; gTokenExp = Date.now() + seconds * 1000;
    lsSet("zg_g_ok", "1");
    try { sessionStorage.setItem("zg_g_token", JSON.stringify({ token: gToken, exp: gTokenExp })); } catch {}

    driveSync(true).then(() => { const c = chats.find(x => x.id === currentId); if (c && c.messages.length !== messages.length && !busy && !speaking) openChat(c); });

  async function getToken(silent) {
    if (gToken && Date.now() < gTokenExp - 60000) return gToken;
    if (AND) {   // in der Android-App meldet die App selbst bei Google an
      return new Promise((res, rej) => {
        window.__zgGoogle = { emit(ev) { if (ev.token) { tokenReceived(ev.token, 50 * 60); res(gToken); } else rej(new Error(ev.error || "Google-Anmeldung fehlgeschlagen")); } };
        if (silent && AND.googleTokenSilent) AND.googleTokenSilent(G_SCOPES.join(" ")); else AND.googleToken(G_SCOPES.join(" "));
      });
    }
    if (!gClientId) throw new Error("Google ist noch nicht eingerichtet");
    await loadGis();
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: gClientId, scope: G_SCOPES.join(" "), callback: () => {} });
    return new Promise((res, rej) => {
      tokenClient.callback = r => {
        if (r.error) return rej(new Error(r.error_description || r.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...G_SCOPES)) note("Hinweis: Du hast nicht alle Google-Rechte erlaubt. Manche Funktionen gehen dann nicht.");
        gToken = r.access_token; gTokenExp = Date.now() + (r.expires_in || 3600) * 1000;
        try { sessionStorage.setItem("zg_g_token", JSON.stringify({ token: gToken, exp: gTokenExp })); } catch {}
        updateGoogleUi(); res(gToken);
        driveSync(true).then(() => { const c = chats.find(x => x.id === currentId); if (c && c.messages.length !== messages.length && !busy && !speaking) openChat(c); });
      };
      tokenClient.error_callback = e => rej(new Error(e && e.type === "popup_closed" ? "Anmeldefenster geschlossen" : "Anmeldung blockiert. Klick links auf „Google verbinden“."));
      tokenClient.requestAccessToken({ prompt: "" });
    });
  }
  async function gApi(url, opts = {}) {

    if (!r.ok) { let m = "Fehler " + r.status; try { m = (await r.json()).error.message; } catch {} throw new Error(m); }

  /* ---------- Google Drive: alle Chats als eine Datei, auf allen Geräten gleich ---------- */
  const DRIVE_NAME = "Zweites Gehirn Chats.json";
  let driveTimer = null, driveBusy = false;
  function driveReady() { return !!(gToken && Date.now() < gTokenExp - 30000); }
  function scheduleDriveSave() { if (!driveReady()) return; clearTimeout(driveTimer); driveTimer = setTimeout(() => driveSync(true), 1500); }
  async function driveFileId() {
    let id = lsGet("zg_drive_file");
    if (id) return id;

  function finAnalyze(d) {
    const tx = (d.transactions || []).filter(t => t.date && isFinite(t.amount))
      .map(t => ({ ...t, name: t.name === "null" ? "" : (t.name || ""), text: t.text === "null" ? "" : (t.text || "") }));

  /* ---------- Wecker (nur Android-App): „Stell einen Wecker bei der Alexa um 5 Uhr“ ---------- */
  const NUMW = { ein:1, eins:1, eine:1, zwei:2, drei:3, vier:4, fünf:5, sechs:6, sieben:7, acht:8, neun:9, zehn:10, elf:11, zwölf:12 };
  const numOf = w => { if (w == null) return NaN; const n = parseInt(w, 10); return isNaN(n) ? (NUMW[w.toLowerCase()] ?? NaN) : n; };
  const TAGE = ["sonntag", "montag", "dienstag", "mittwoch", "donnerstag", "freitag", "samstag"];
  /** Liest aus dem Satz die Weckzeit. Rückgabe: { at: Date, h, m, dayWord } oder null */
  function parseAlarmTime(text, now = new Date()) {
    const t = text.toLowerCase().replace(/[.!?]+$/, "");
    const N = "(\\d{1,2}|ein|eins|eine|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf)";
    let rel = /\bin\s+(\d{1,3}|einer|einem|eine|zwei|drei|fünf|zehn|zwanzig|dreißig)\s+(minuten?|stunden?)\b/.exec(t);
    if (rel) {
      const map = { einer:1, einem:1, eine:1, zwanzig:20, "dreißig":30 };
      const n = parseInt(rel[1], 10) || map[rel[1]] || NUMW[rel[1]] || 0;
      if (!n) return null;
      const at = new Date(now.getTime() + n * (rel[2].startsWith("stunde") ? 3600000 : 60000));
      at.setSeconds(0, 0);
      return { at, h: at.getHours(), m: at.getMinutes(), dayWord: "", rel: true };
    }
    let h = NaN, m = 0, x;
    if ((x = new RegExp("\\bhalb\\s+" + N + "\\b").exec(t))) { h = numOf(x[1]) - 1; m = 30; }
    else if ((x = new RegExp("\\bviertel\\s+nach\\s+" + N + "\\b").exec(t))) { h = numOf(x[1]); m = 15; }
    else if ((x = new RegExp("\\bviertel\\s+vor\\s+" + N + "\\b").exec(t))) { h = numOf(x[1]) - 1; m = 45; }
    else if ((x = /\b(\d{1,2})[:.](\d{2})\b/.exec(t))) { h = +x[1]; m = +x[2]; }
    else if ((x = new RegExp("\\b" + N + "\\s*uhr(?:\\s+(\\d{1,2}))?\\b").exec(t))) { h = numOf(x[1]); m = x[2] ? +x[2] : 0; }
    else if ((x = new RegExp("\\bum\\s+" + N + "\\b").exec(t))) { h = numOf(x[1]); }
    if (isNaN(h)) return null;
    if (h === -1) h = 23;
    if (/\b(abends|nachmittags|am abend|am nachmittag|nachts?)\b/.test(t) && h < 12 && !(/nachts?/.test(t) && h < 5)) h += 12;
    if (h > 23 || m > 59) return null;
    const at = new Date(now); at.setHours(h, m, 0, 0);
    let dayWord = "";
    if (/(?:^|\s)übermorgen\b/.test(t)) { at.setDate(at.getDate() + 2); dayWord = "übermorgen"; }
    else if (/\bmorgen\b/.test(t)) { at.setDate(at.getDate() + 1); dayWord = "morgen"; }
    else {
      const d = TAGE.findIndex(w => new RegExp("\\b(?:am\\s+)?" + w + "\\b").test(t));
      if (d >= 0) {
        let add = (d - now.getDay() + 7) % 7;
        if (add === 0 && at <= now) add = 7;
        at.setDate(at.getDate() + add); dayWord = "am " + TAGE[d][0].toUpperCase() + TAGE[d].slice(1);
      } else if (at <= now) at.setDate(at.getDate() + 1);
    }
    if (at <= now) return null;
    if (!dayWord) {
      const diff = Math.round((new Date(at).setHours(0,0,0,0) - new Date(now).setHours(0,0,0,0)) / 86400000);
      dayWord = diff === 0 ? "heute" : diff === 1 ? "morgen" : "";
    }
    return { at, h, m, dayWord };
  }
  const zeitText = (h, m) => m ? `${h}:${String(m).padStart(2, "0")} Uhr` : `${h} Uhr`;

  function handleAlarm(text) {
    const t = text.trim();
    if (!/\b(wecker|weckzeit|weck(?:e)?\s+mich)\b/i.test(t)) return false;
    const alexa = /\b(alexa|echo)\b/i.test(t);
    if (!AND) { assistantSay("Wecker stellen geht nur in der Android-App auf deinem Handy."); return true; }
    const has = n => typeof AND[n] === "function";
    // Wecker löschen
    if (/\b(lösch\w*|entfern\w*|abbrech\w*|brich|streich\w*|stornier\w*|deaktivier\w*|mach\w*\s+.*\baus|ausschalten)\b/i.test(t)) {
      if (!has("alexaCancel")) { assistantSay("Dafür brauchst du die neueste Version der App."); return true; }
      let list = []; try { list = JSON.parse(AND.alexaAlarms()); } catch {}
      if (!list.length) { assistantSay(alexa ? "Es ist kein Alexa-Wecker gestellt." : "Es ist kein Alexa-Wecker gestellt. Wecker in deiner Uhr-App löschst du bitte dort."); return true; }
      AND.alexaCancel(-1);
      assistantSay(list.length === 1 ? "Der Alexa-Wecker ist gelöscht." : `Alle ${list.length} Alexa-Wecker sind gelöscht.`);
      return true;
    }
    // Welche Wecker sind gestellt?
    if (/\b(welche[rn]?|zeig\w*|liste|hab\s+ich|sind|ist)\b.*\bwecker\b/i.test(t) && !/\b(stell|setz|mach|erstell|weck)\w*\b/i.test(t)) {
      let list = []; try { list = JSON.parse(AND.alexaAlarms()); } catch {}
      if (!list.length) { assistantSay("Es ist gerade kein Alexa-Wecker gestellt."); return true; }
      const parts = list.sort((a, b) => a.at - b.at).map(a => { const d = new Date(a.at); return d.toLocaleDateString("de-DE", { weekday: "long" }) + " um " + zeitText(d.getHours(), d.getMinutes()); });
      assistantSay("Alexa-Wecker gestellt für: " + parts.join(", ") + ".");
      return true;
    }
    const when = parseAlarmTime(t);
    if (!when) { assistantSay("Um wie viel Uhr soll der Wecker klingeln? Sag zum Beispiel: stell einen Wecker um 5 Uhr."); return true; }
    const wann = (when.dayWord ? when.dayWord + " um " : "um ") + zeitText(when.h, when.m);
    if (alexa) {
      if (!has("alexaAlarm")) { assistantSay("Dafür brauchst du die neueste Version der App. Lade sie bitte neu herunter."); return true; }
      if (!AND.alexaReady()) {
        assistantSay("Die Alexa ist noch nicht verbunden. Trag bitte in den App-Einstellungen deinen Voice-Monkey-Schlüssel ein. Ich öffne sie dir.");
        setTimeout(() => { try { AND.openSetup(); } catch {} }, 3500);

      }

      assistantSay(`Alexa-Wecker für ${wann} ist gestellt.`);
      return true;
    }
    if (!has("phoneAlarm")) { assistantSay("Dafür brauchst du die neueste Version der App."); return true; }
    AND.phoneAlarm(when.h, when.m, "Jarvis");
    const far = when.at.getTime() - Date.now() > 24 * 3600000;
    assistantSay(far ? `Ich habe den Wecker in deiner Uhr-App auf ${zeitText(when.h, when.m)} gestellt. Er klingelt beim nächsten Mal um diese Uhrzeit, nicht erst ${when.dayWord}.`
                     : `Wecker für ${wann} ist gestellt.`);
    return true;
  }

      const r1 = R * .98, r2 = R * (long ? .90 : mid ? .93 : .95);
      cx.strokeStyle = rgba(col, long ? .85 : mid ? .45 : .22); cx.lineWidth = long ? 2 : 1;
      cx.beginPath(); cx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1); cx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2); cx.stroke();
    }
    cx.restore();

    // Bogen-Segmente (drehen gegenläufig)
    const arcs = (rad, width, rotv, segs, alpha) => {
      cx.save(); cx.translate(ox, oy); cx.rotate(rotv);
      cx.strokeStyle = rgba(col, alpha); cx.lineWidth = width; cx.lineCap = "round";
      for (const [s0, len] of segs) { cx.beginPath(); cx.arc(0, 0, rad, s0, s0 + len); cx.stroke(); }
      cx.restore();
    };
    cx.shadowColor = rgba(col, .8); cx.shadowBlur = 12;
    arcs(R * .84, 3, spinA, [[0, 1.1], [1.6, .5], [2.5, 1.4], [4.3, .9]], .75 + energy * .25);
    arcs(R * .77, 1.5, spinB, [[.4, .3], [1.2, 1.8], [3.6, .25], [4.2, 1.3]], .45 + energy * .3);
    cx.shadowBlur = 0;

    // Stimm-Welle (reagiert auf Zuhören/Sprechen)
    const amp = R * (.012 + energy * .07);
    cx.beginPath();
    for (let i = 0; i <= 160; i++) {
      const a = i / 160 * Math.PI * 2;
      const n = Math.sin(a * 6 + t * 5.3) * .5 + Math.sin(a * 11 - t * 7.1) * .3 + Math.sin(a * 17 + t * 9.7) * .2;
      const rr = R * .69 + n * amp * (speaking || listening ? (0.6 + 0.4 * Math.abs(Math.sin(t * 3.1))) : .6);
      const x = ox + Math.cos(a) * rr, y = oy + Math.sin(a) * rr;
      i ? cx.lineTo(x, y) : cx.moveTo(x, y);
    }
    cx.closePath(); cx.strokeStyle = rgba(col, .55 + energy * .4); cx.lineWidth = 1.6;
    cx.shadowColor = rgba(col, 1); cx.shadowBlur = 10 + energy * 14; cx.stroke(); cx.shadowBlur = 0;

    // Punkt-Kugel
    const RS = R * .56 * (1 + energy * .04 * Math.sin(t * (speaking ? 9 : listening ? 6 : 3)));
    const cr = Math.cos(rot), sr = Math.sin(rot), ct = Math.cos(.4), stt = Math.sin(.4);
    for (const [x, y, z] of pts) {
      const x1 = x * cr + z * sr, z1 = -x * sr + z * cr, y2 = y * ct - z1 * stt, z2 = y * stt + z1 * ct, a = (z2 + 1.2) / 2.2;
      cx.fillStyle = `rgba(${(col[0] + (255 - col[0]) * a * .6) | 0},${(col[1] + (255 - col[1]) * a * .5) | 0},255,${.12 + a * .8})`;
      cx.beginPath(); cx.arc(ox + x1 * RS, oy + y2 * RS, .5 + a * 1.5, 0, 7); cx.fill();
    }

    // Kern
    const core = cx.createRadialGradient(ox, oy, 0, ox, oy, R * .22);
    core.addColorStop(0, `rgba(255,255,255,${.75 + energy * .25})`); core.addColorStop(.35, rgba(col, .55 + energy * .3)); core.addColorStop(1, rgba(col, 0));
    cx.fillStyle = core; cx.beginPath(); cx.arc(ox, oy, R * .22, 0, 7); cx.fill();

    // HUD-Beschriftung, die langsam um den Kern kreist
    if (!MINI && R > 60) {
      cx.save(); cx.translate(ox, oy); cx.rotate(-spinA * .25);
      cx.font = `600 ${Math.max(9, R * .075)}px "Chakra Petch", sans-serif`; cx.fillStyle = rgba(col, .75); cx.textAlign = "center";
      const labels = ["J.A.R.V.I.S", st === "listen" ? "AUDIO IN" : st === "think" ? "ANALYSE" : st === "speak" ? "AUDIO OUT" : "BEREIT", "KERN " + Math.round(60 + energy * 40) + "%"];
      labels.forEach((txt, k) => {
        cx.save(); cx.rotate(k * (Math.PI * 2 / 3) + .5);
        cx.translate(0, -R * 1.13);
        cx.fillText(txt, 0, 0);
        cx.restore();
      });
      cx.restore();
    }
    // kleine Markierungen oben/unten
    cx.fillStyle = rgba(col, .9);
    for (const s of [-1, 1]) { cx.beginPath(); cx.moveTo(ox - 5, oy + s * R * 1.04); cx.lineTo(ox + 5, oy + s * R * 1.04); cx.lineTo(ox, oy + s * R * .99); cx.closePath(); cx.fill(); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ================= Start ================= */
  (async () => {
    bootSequence(); spawnMotes(); renderTiles();
    updateLoopUi(); updatePauseUi(); updateGoogleUi(); refreshUi();
    renderChat();
    await initStore();
    renderAll();   // beim Öffnen immer mit einem neuen Gespräch starten, alte stehen rechts unter „Gespräche“
    await checkAi();
    warmUp();
    if (AND) {
      wakeOn = AND.wakeOn();
      if (lsGet("zg_g_ok") === "1") getToken(true).catch(() => {});   // Drive-Abgleich ohne Nachfrage, falls schon erlaubt
      if (AND.consumeWake()) nativeWake();
      if (AND.consumeDiary && AND.consumeDiary()) setTimeout(() => startDiary(true), 1800);
    }
    if (MINI) startMiniWatch();
    $("cWakeState").textContent = wakeOn ? "AN" : "AUS";
    if (wakeOn && !AND) { lockScreen(); scheduleWake(800); }
  })();
</script>
