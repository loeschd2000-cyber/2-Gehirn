<title>Zweites Gehirn</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040b16">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Kommandozentrale: KI über Ollama (lokal), Mikrofon + Stimme, Google (Kalender, Gmail, Kontakte).
     Läuft über den kleinen Server auf dem PC, auf dem Handy über Tailscale. Bewusst immer dunkel. */
  :root {
    --bg: #040b16;
    --panel: rgba(10, 28, 48, .72);
    --panel-2: rgba(14, 38, 64, .7);
    --line: rgba(64, 180, 230, .22);
    --line-hi: rgba(80, 210, 255, .55);
    --ink: #d9f1ff;
    --muted: #7ea3bd;
    --cyan: #3fd6ff;
    --cyan-soft: rgba(63, 214, 255, .14);
    --ok: #3ee89a;
    --warn: #ffb547;
    --bad: #ff6b6b;
    --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
    background:
      radial-gradient(1200px 700px at 50% 38%, rgba(20, 90, 140, .35), transparent 60%),
      radial-gradient(800px 500px at 90% 110%, rgba(20, 70, 120, .25), transparent 60%),
      var(--bg);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; opacity: .18;
  }
  .app {
    position: relative; min-height: 100%; display: flex; flex-direction: column; gap: 14px;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));
    max-width: 1440px; margin: 0 auto;
  }

  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .mark { width: 40px; height: 40px; border-radius: 50%; flex: none; border: 2px solid var(--cyan); box-shadow: 0 0 16px var(--cyan), inset 0 0 12px var(--cyan-soft); display: grid; place-items: center; }
  .mark::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .brand b { font-family: var(--display); font-size: 20px; letter-spacing: .22em; display: block; line-height: 1.1; }
  .brand small { font-family: var(--display); font-size: 11px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
  .clock { text-align: center; }
  .clock .d { font-size: 13px; color: var(--muted); }
  .clock .t { font-family: var(--display); font-size: 30px; font-weight: 700; color: var(--cyan); letter-spacing: .06em; text-shadow: 0 0 18px rgba(63, 214, 255, .5); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .top-right { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .pill { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; border: 1px solid var(--line-hi); border-radius: 999px; padding: 6px 12px; background: var(--panel); display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 8px var(--bad); }

  .grid { flex: 1; display: grid; grid-template-columns: 290px minmax(0, 1fr) 300px; gap: 14px; min-height: 0; }
  .col { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; backdrop-filter: blur(6px); position: relative; min-width: 0; box-shadow: inset 0 0 24px rgba(63, 214, 255, .04); }
  .panel h2 { margin: 0 0 12px; font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .panel h2 span { color: var(--muted); letter-spacing: .1em; font-size: 11px; }

  .status { display: flex; flex-direction: column; gap: 8px; }
  .srow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
  .srow .k { font-weight: 600; font-size: 14px; }
  .srow .v { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .srow > div { min-width: 0; flex: 1; }
  select { width: 100%; margin-top: 4px; background: #071526; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; }

  .cmds { display: flex; flex-direction: column; gap: 8px; }
  .cmd { font: inherit; font-size: 14px; color: var(--ink); text-align: left; cursor: pointer; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cmd:hover { border-color: var(--line-hi); background: var(--cyan-soft); }
  .cmd em { font-style: normal; color: var(--cyan); font-family: var(--display); font-size: 12px; letter-spacing: .1em; }
  .cmd.alert { border-color: var(--warn); }
  .cmd.alert em { color: var(--warn); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .gsetup { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding: 10px; border-radius: 10px; border: 1px dashed var(--line-hi); }
  .gsetup label { font-size: 12px; color: var(--muted); }
  .gsetup input { background: #071526; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font: inherit; font-size: 13px; min-width: 0; }
  .gsetup .row { display: flex; gap: 8px; }
  .gsetup .row button { flex: 1; }

  .core { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; padding: 12px 14px 14px; }
  .orbwrap { position: relative; height: clamp(170px, 28vh, 320px); flex: none; }
  canvas { width: 100%; height: 100%; display: block; }
  .orblabel { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .orblabel b { font-family: var(--display); font-size: clamp(20px, 3vw, 30px); letter-spacing: .35em; color: var(--cyan); text-shadow: 0 0 20px rgba(63, 214, 255, .7); padding-left: .35em; }
  .orblabel small { font-family: var(--display); font-size: 12px; letter-spacing: .3em; opacity: .8; text-transform: uppercase; }
  .state { font-family: var(--display); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); text-align: center; min-height: 18px; }

  .log { flex: 1; min-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px; max-height: 40vh; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me { align-self: flex-end; background: rgba(63, 214, 255, .16); border: 1px solid var(--line-hi); }
  .msg.ai { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); }
  .msg.wait { color: var(--muted); }
  .note { align-self: center; color: var(--warn); font-size: 13px; text-align: center; max-width: 90%; }

  .card { align-self: flex-start; max-width: 92%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--cyan); background: rgba(63, 214, 255, .1); display: flex; flex-direction: column; gap: 6px; }
  .card b { font-family: var(--display); letter-spacing: .06em; }
  .card .sub { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .card .body { white-space: pre-wrap; font-size: 14px; border-left: 2px solid var(--line-hi); padding-left: 10px; margin-block: 4px; overflow-wrap: anywhere; }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .btn { font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 7px 14px; border: 1px solid var(--line-hi); background: var(--panel-2); color: var(--ink); text-decoration: none; }
  .btn.primary { background: var(--cyan); color: #03121f; border-color: var(--cyan); }

  .talk { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .mic { display: flex; align-items: center; gap: 14px; cursor: pointer; border: 1px solid var(--line-hi); border-radius: 999px; padding: 12px 28px 12px 14px; background: rgba(8, 24, 42, .92); color: var(--ink); font: inherit; box-shadow: 0 0 28px rgba(63, 214, 255, .25); max-width: 100%; }
  .mic .ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; background: radial-gradient(circle, rgba(63,214,255,.35), rgba(63,214,255,.08)); border: 2px solid var(--cyan); box-shadow: 0 0 18px var(--cyan); }
  .mic svg { width: 22px; height: 22px; fill: var(--cyan); }
  .mic b { font-family: var(--display); letter-spacing: .2em; font-size: 16px; color: var(--cyan); display: block; }
  .mic small { color: var(--muted); font-size: 12px; }
  .mic.live { box-shadow: 0 0 40px rgba(63, 214, 255, .6); }
  .mic.live .ring { animation: pulse 1s ease-in-out infinite; }
  .mic.busy .ring { border-color: var(--bad); box-shadow: 0 0 18px var(--bad); }
  .mic.busy svg { fill: var(--bad); }
  @keyframes pulse { 50% { transform: scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .mic.live .ring { animation: none; } }

  form { width: 100%; display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 999px; padding: 5px 5px 5px 18px; background: rgba(8, 24, 42, .7); }
  textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent; font: inherit; color: var(--ink); max-height: 100px; padding-block: 8px; }
  textarea::placeholder { color: var(--muted); }
  .send { border: 0; border-radius: 999px; padding: 9px 18px; cursor: pointer; font-family: var(--display); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; background: var(--cyan); color: #03121f; }

  .hist { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .list { flex: 1; min-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 46vh; }
  .item { display: flex; align-items: center; gap: 4px; border-radius: 10px; border: 1px solid transparent; }
  .item.active { border-color: var(--line-hi); background: var(--cyan-soft); }
  .item .open { flex: 1; min-width: 0; text-align: left; background: transparent; border: 0; color: var(--ink); cursor: pointer; padding: 8px 10px; font: inherit; display: flex; flex-direction: column; gap: 1px; border-radius: 10px; }
  .item .open:hover { background: var(--panel-2); }
  .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 500; }
  .item .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .item .del { background: transparent; border: 0; color: var(--muted); cursor: pointer; font: inherit; font-size: 12px; padding: 6px 8px; }
  .item .del.confirm { color: var(--bad); }
  .empty { color: var(--muted); font-size: 14px; margin: 0; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-family: var(--display); font-size: 22px; color: var(--cyan); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  @media (max-width: 1100px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    .core-col { order: -1; }
    .side { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  }
  @media (max-width: 640px) {
    .top { grid-template-columns: 1fr auto; }
    .top-right { display: none; }
    .brand small { display: none; }
    .brand b { font-size: 16px; }
    .clock { text-align: right; }
    .clock .d { display: none; }
    .clock .t { font-size: 22px; }
    .log { max-height: none; }
    .core { min-height: calc(100vh - 110px); }
    .talk { position: sticky; bottom: 0; z-index: 2; padding-block: 10px calc(4px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--bg) 22%); }
  }
  /* ---------- Kleiner Kreis (Android, nach „Hey Jarvis“): nur Kern + letzte Antwort, Hintergrund durchsichtig ---------- */
  body.mini { background: transparent !important; }
  body.mini::before, body.mini .top, body.mini .side, body.mini form, body.mini .mic, body.mini .state { display: none !important; }
  body.mini .app { padding: 0 10px 10px; min-height: 100%; height: 100%; justify-content: flex-end; }
  body.mini .grid { display: block; flex: none; }
  body.mini .core { flex: none; background: rgba(4, 11, 22, .9); border-color: var(--line-hi); border-radius: 26px; padding: 10px 12px; gap: 4px; box-shadow: 0 0 34px rgba(63, 214, 255, .28); }
  body.mini .orbwrap { height: 100px; order: 3; cursor: pointer; }
  body.mini .orblabel { display: none; }
  body.mini .log { order: 1; min-height: 0; max-height: 160px; flex: none; padding: 2px; }
  body.mini .log > * { display: none; }
  body.mini .log > .msg:nth-last-child(-n+2), body.mini .log > .note:last-child { display: block; }
  body.mini .log > .card:nth-last-child(-n+2) { display: flex; }
  body.mini .talk { order: 2; }
  body.mini .msg { font-size: 15px; padding: 8px 12px; }
  .mini-full { display: none; }
  body.mini .mini-full { display: block; position: absolute; bottom: 14px; left: 14px; z-index: 2; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div><b>ZWEITES GEHIRN</b><small>Kommandozentrale</small></div>
    </div>
    <div class="clock"><div class="d" id="date">&nbsp;</div><div class="t" id="time">--:--:--</div></div>
    <div class="top-right">
      <span class="pill"><span class="dot" id="sysDot"></span><span id="sysText">Startet</span></span>
    </div>
  </header>

  <div class="grid">
    <div class="col side">
      <section class="panel">
        <h2>Systemstatus</h2>
        <div class="status">
          <div class="srow"><span class="dot" id="aiDot"></span><div><div class="k">KI-Kern</div><div class="v" id="aiV">Verbindet …</div><select id="model" aria-label="KI-Modell" hidden></select></div></div>
          <div class="srow"><span class="dot" id="micDot"></span><div><div class="k">Mikrofon</div><div class="v" id="micV">Bereit</div></div></div>
          <div class="srow"><span class="dot" id="vDot"></span><div><div class="k">Stimme</div><div class="v" id="vV">Prüft …</div></div></div>
          <div class="srow"><span class="dot" id="gDot"></span><div><div class="k">Google</div><div class="v" id="gV">Nicht verbunden</div></div></div>
          <div class="srow"><span class="dot" id="stDot"></span><div><div class="k">Speicher</div><div class="v" id="stV">Prüft …</div></div></div>
        </div>
      </section>
      <section class="panel">
        <h2>Schnellbefehle</h2>
        <div class="cmds">
          <button class="cmd" type="button" id="cNew">Neues Gespräch <em>+</em></button>
          <button class="cmd" type="button" id="cWake">„Hey Jarvis“ <em id="cWakeState">AUS</em></button>
          <button class="cmd" type="button" id="cLoop">Dauergespräch <em id="cLoopState">AN</em></button>
          <button class="cmd" type="button" id="cVoice">Stimme <em id="cVoiceState">AN</em></button>
          <button class="cmd" type="button" id="cPause">Sprechpause <em id="cPauseState">2,5 S</em></button>
          <button class="cmd" type="button" id="cAi">KI-Quelle <em id="cAiState">AUTO</em></button>
          <button class="cmd" type="button" id="cGoogle">Google verbinden <em>G</em></button>
          <button class="cmd" type="button" id="cApp" hidden>App-Einstellungen <em>⚙</em></button>
        </div>
        <div class="gsetup" id="kSetup" hidden>
          <label for="kId">Gemini-Schlüssel (beginnt meist mit AIza…)</label>
          <input id="kId" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
          <div class="row">
            <button class="cmd" type="button" id="kSave">Speichern</button>
            <button class="cmd" type="button" id="kCancel">Abbrechen</button>
          </div>
        </div>
        <div class="gsetup" id="gSetup" hidden>
          <label for="gId">Google Client-ID (endet auf .apps.googleusercontent.com)</label>
          <input id="gId" type="text" autocomplete="off" spellcheck="false" placeholder="123456-abc.apps.googleusercontent.com">
          <div class="row">
            <button class="cmd" type="button" id="gSave">Verbinden</button>
            <button class="cmd" type="button" id="gCancel">Abbrechen</button>
          </div>
        </div>
      </section>
    </div>

    <div class="col core-col">
      <section class="panel core">
        <button class="mini-full" type="button" id="miniFull">App öffnen</button>
        <div class="orbwrap">
          <canvas id="orb" aria-hidden="true"></canvas>
          <div class="orblabel"><b>KERN</b><small>Zweites Gehirn</small></div>
        </div>
        <div class="state" id="state">Bereit</div>
        <div class="log" id="log" aria-live="polite"></div>
        <div class="talk">
          <button class="mic" type="button" id="mic">
            <span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></span>
            <span><b id="micTitle">SPRICH MIT MIR</b><small id="micSub">Klicken oder Leertaste</small></span>
          </button>
          <form id="form">
            <textarea id="input" rows="1" placeholder="… oder hier tippen" aria-label="Nachricht"></textarea>
            <button class="send" type="submit">Senden</button>
          </form>
        </div>
      </section>
    </div>

    <div class="col side">
      <section class="panel hist">
        <h2>Gespräche <span id="histCount">0</span></h2>
        <div class="list" id="list"></div>
      </section>
      <section class="panel">
        <h2>Gedächtnis</h2>
        <div class="stats">
          <div class="stat"><b id="sChats">0</b><span>Chats</span></div>
          <div class="stat"><b id="sMsgs">0</b><span>Nachr.</span></div>
          <div class="stat"><b id="sToday">0</b><span>Heute</span></div>
        </div>
      </section>
    </div>
  </div>
</div>

<script>
  /* ================= Grundlagen ================= */
  /* ================= Android-App: Brücke zu Mikrofon, Stimme, Google und „Hey Jarvis“ ================= */
  // Läuft die Seite in der Zweites-Gehirn-Android-App, übernimmt die App Mikrofon und Stimme (Webseiten dürfen das dort nicht).
  const AND = window.ZGAndroid || null;
  const MINI = !!(AND && AND.isMini && AND.isMini());
  if (MINI) document.body.classList.add("mini");
  if (AND) (function installAndroid() {
    const active = {};
    window.__zgSR = {
      emit(ev) {
        const r = active[ev.sid]; if (!r) return;
        if (ev.type === "result") { const res = [[{ transcript: ev.text }]]; res[0].isFinal = !!ev.final; r.onresult && r.onresult({ resultIndex: 0, results: res }); }
        else if (ev.type === "error") { r.onerror && r.onerror({ error: ev.error }); }
        else if (ev.type === "end") { delete active[ev.sid]; r.onend && r.onend(); }
      },
    };
    class NativeSR {
      constructor() { this.lang = "de-DE"; this.interimResults = true; this.continuous = false; this.maxAlternatives = 1; }
      start() { this.sid = AND.srStart(this.lang, !!this.interimResults); active[this.sid] = this; }
      stop() { if (this.sid) AND.srStop(this.sid); }
      abort() { if (this.sid) AND.srAbort(this.sid); }
    }
    window.SpeechRecognition = window.webkitSpeechRecognition = NativeSR;

    const utt = {}; let voices = [], n = 0;
    const nsynth = {
      speak(u) { const id = "u" + (++n); utt[id] = u; AND.ttsSpeak(id, u.text, u.voice ? u.voice.name : "", u.rate || 1); },
      cancel() { AND.ttsCancel(); },
      getVoices() { return voices; },
      onvoiceschanged: null,
    };
    window.__zgTTS = {
      emit(ev) {
        const u = utt[ev.id]; if (!u) return;
        if (ev.type === "start") { u.onstart && u.onstart({}); return; }
        delete utt[ev.id];
        if (ev.type === "error") { u.onerror && u.onerror({}); } else { u.onend && u.onend({}); }
      },
      voices() { try { voices = JSON.parse(AND.ttsVoices()); } catch { voices = []; } nsynth.onvoiceschanged && nsynth.onvoiceschanged(); },
    };
    try { voices = JSON.parse(AND.ttsVoices()); } catch {}
    window.SpeechSynthesisUtterance = function (t) { this.text = t; this.lang = "de-DE"; this.voice = null; this.rate = 1; };
    try { Object.defineProperty(window, "speechSynthesis", { value: nsynth, configurable: true }); } catch {}
  })();

  const VIA_SERVER = /^https?:$/.test(location.protocol);
  const OLLAMA = VIA_SERVER ? "/ollama" : "http://localhost:11434";
  const PREFERRED_MODEL = "gemma3:4b";
  const TZ = "Europe/Berlin";
  const WD = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
  const GREETING = "Hallo Damian. Klick auf „Sprich mit mir“ und leg los.";
  const STORE_KEY = "zg_pc_chats";
  const IS_ANDROID = /Android/i.test(navigator.userAgent);

  const $ = id => document.getElementById(id);
  const log = $("log"), input = $("input"), stateEl = $("state"), micBtn = $("mic"), list = $("list"), modelSel = $("model");
  const setDot = (id, cls) => { $(id).className = "dot" + (cls ? " " + cls : ""); };
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const sayDate = d => `${WD[d.getDay()]}, ${d.getDate()}. ${d.toLocaleDateString("de-DE", { month: "long" })}`;
  const sayTime = d => d.getMinutes() ? `${d.getHours()}:${pad(d.getMinutes())} Uhr` : `${d.getHours()} Uhr`;

  function RULES() {
    const n = new Date();
    return `Du bist die KI in Damians App 'Zweites Gehirn'. Damian macht eine Ausbildung zum Elektroniker für Automatisierungstechnik. Er ruft dich manchmal mit „Hey Jarvis“. Heute ist ${WD[n.getDay()]}, der ${n.toLocaleDateString("de-DE")}, ${pad(n.getHours())}:${pad(n.getMinutes())} Uhr. Deine Antworten werden laut vorgelesen: Antworte immer auf Deutsch, natürlich wie im Gespräch, kurz und klar (meist 1 bis 3 Sätze), außer er will mehr Details. Keine Markdown-Formatierung, keine Sternchen, keine Aufzählungszeichen, keine Emojis. Die App kann auf dem Handy Kontakte anrufen, Musik auf Spotify abspielen und steuern, Wecker stellen (auch auf der Alexa), Termine eintragen und anzeigen, Mails prüfen, zusammenfassen und als Entwurf schreiben und Kontakte nachschlagen. Behaupte nie, du hättest so etwas selbst erledigt.`;
  }

  let chats = [], currentId = null, messages = [];
  let model = null, ollamaOk = false;
  let busy = false, listening = false, speaking = false;
  let voiceOn = true, loopOn = true, lastViaVoice = false;
  let ctl = null, rec = null, armedDelete = null;
  let pending = null;   // offene Rückfrage (Termin eintragen / Entwurf speichern)

  /* ================= Uhr ================= */
  function tick() {
    const n = new Date();
    $("time").textContent = n.toLocaleTimeString("de-DE");
    $("date").textContent = n.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  }
  tick(); setInterval(tick, 1000);

  /* ================= Speicher (PC-Ordner über den Server, Browser als Zwischenspeicher) ================= */
  let serverStore = false;
  function loadLocal() {
    try { chats = JSON.parse(lsGet(STORE_KEY) || "[]"); } catch { chats = []; }
    if (!Array.isArray(chats)) chats = [];
  }
  function saveLocal() { lsSet(STORE_KEY, JSON.stringify(chats)); lsSet("zg_deleted", JSON.stringify(deleted)); }
  // Gelöschte Chats merken, damit sie beim Abgleich mit Drive nicht wieder auftauchen
  let deleted = [];
  try { deleted = JSON.parse(lsGet("zg_deleted") || "[]"); if (!Array.isArray(deleted)) deleted = []; } catch { deleted = []; }
  function mergeInto(list, delList) {
    for (const d of delList || []) if (d && d.id && !deleted.some(x => x.id === d.id)) deleted.push(d);
    const byId = new Map(chats.map(c => [c.id, c]));
    for (const c of list || []) {
      if (!c || !c.id || !Array.isArray(c.messages)) continue;
      const mine = byId.get(c.id);
      if (!mine || (c.updated || 0) > (mine.updated || 0)) byId.set(c.id, c);
    }
    chats = [...byId.values()].filter(c => !deleted.some(d => d.id === c.id && d.ts >= (c.updated || 0)));
  }
  const safeName = s => (s || "Gespräch").replace(/[\\/:*?"<>|\r\n]+/g, "-").trim().slice(0, 48) || "Gespräch";
  const tStr = ts => new Date(ts).toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  function mdOf(c) {
    let md = `# ${c.title}\n\nErstellt: ${new Date(c.created).toLocaleString("de-DE")}\nZuletzt geändert: ${new Date(c.updated).toLocaleString("de-DE")}\nQuelle: Zweites Gehirn (PC/Handy, Ollama)\n\n`;
    for (const m of c.messages) md += `**${m.role === "user" ? "Damian" : "KI"}** (${tStr(m.ts)}):\n${m.content}\n\n`;
    return md;
  }
  async function uploadChat(c) {
    if (!serverStore) return;
    try {
      await fetch("/data/chats/" + c.id, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(c) });
      await fetch("/data/md?name=" + encodeURIComponent(`PC ${ymd(new Date(c.created))} ${safeName(c.title)} [${c.id}].md`), { method: "PUT", headers: { "Content-Type": "text/markdown; charset=utf-8" }, body: mdOf(c) });
    } catch { note("Speichern auf dem PC hat gerade nicht geklappt. Läuft das Server-Fenster?"); }
  }
  async function fetchServerChats() {
    const r = await fetch("/data/chats", { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    return Array.isArray(data) ? data.filter(c => c && c.id && Array.isArray(c.messages)) : [];
  }
  async function initStore() {
    loadLocal();
    if (VIA_SERVER) {
      try {
        const remote = await fetchServerChats();
        serverStore = true;
        const byId = new Map(remote.map(c => [c.id, c]));
        for (const c of chats) {            // ältere Chats aus dem Browser einmalig auf den PC übertragen
          const r = byId.get(c.id);
          if (!r || c.updated > r.updated) { byId.set(c.id, c); await uploadChat(c); }
        }
        chats = [...byId.values()].filter(c => !deleted.some(d => d.id === c.id && d.ts >= (c.updated || 0)));
        saveLocal();
      } catch { serverStore = false; }
    }
    updateStoreUi();
  }
  function updateStoreUi() {
    const parts = [];
    if (serverStore) parts.push("PC-Ordner");
    if (driveReady()) parts.push("Google Drive");
    if (parts.length) { setDot("stDot", "ok"); $("stV").textContent = "Gespeichert in: " + parts.join(" + "); }
    else { setDot("stDot", "warn"); $("stV").textContent = gClientId ? "Nur auf diesem Gerät. Tipp auf „Google verbinden“, dann wird in Drive gespeichert." : "Nur auf diesem Gerät. Mit Google verbinden, damit alles überall gleich ist."; }
  }
  async function syncFromServer() {          // wenn am Handy oder PC etwas dazugekommen ist
    if (busy || listening) return;
    if (serverStore) { try { mergeInto(await fetchServerChats(), []); } catch {} }
    if (driveReady()) await driveSync(false);
    saveLocal();
    const c = chats.find(x => x.id === currentId);
    if (c && c.messages.length !== messages.length && !speaking) openChat(c); else renderAll();
  }
  window.addEventListener("focus", syncFromServer);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) syncFromServer(); });

  async function persist() {
    const now = Date.now();
    let c = chats.find(x => x.id === currentId);
    if (!c) {
      const first = messages.find(m => m.role === "user");
      currentId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      c = { id: currentId, title: first ? first.content.slice(0, 48) : "Gespräch", created: now, updated: now, messages: [] };
      chats.push(c);
    }
    c.messages = messages.map(m => ({ ...m })); c.updated = now;
    saveLocal(); renderAll();
    scheduleDriveSave();
    await uploadChat(c);
  }

  /* ================= Stimme (Ausgabe) ================= */
  const synth = window.speechSynthesis || null;
  let voice = null, queue = 0;
  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices().filter(v => /^de/i.test(v.lang));
    voice = vs.find(v => /natural/i.test(v.name)) || vs.find(v => /online|google/i.test(v.name)) || vs[0] || null;
    updateVoiceUi();
  }
  function updateVoiceUi() {
    $("cVoiceState").textContent = voiceOn ? "AN" : "AUS";
    if (!synth) { setDot("vDot", "bad"); $("vV").textContent = "Browser kann nicht vorlesen"; return; }
    setDot("vDot", voiceOn ? "ok" : "");
    $("vV").textContent = voiceOn ? (voice ? voice.name : "Deutsche Standardstimme") : "Aus";
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; } else updateVoiceUi();

  // Text erscheint genau dann, wenn die Stimme ihn spricht
  let bubbleEl = null, shown = "", fullAnswer = "";
  function reveal(chunk) {
    if (!bubbleEl) return;
    shown += chunk;
    bubbleEl.classList.remove("wait");
    bubbleEl.textContent = shown.trim();
    log.scrollTop = log.scrollHeight;
  }
  function revealAll() {
    if (bubbleEl && fullAnswer) { shown = fullAnswer; bubbleEl.classList.remove("wait"); bubbleEl.textContent = fullAnswer.trim(); }
  }
  const voiceActive = () => !!synth && voiceOn;

  let ttsEpoch = 0;   // wird bei jedem Stoppen erhöht, damit alte Sätze nicht weiterlaufen
  function speak(text, onShow) {
    const clean = text.replace(/[*#_`>]/g, "").trim();
    if (!voiceActive() || !clean) { onShow && onShow(); return; }
    const ep = ttsEpoch;
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "de-DE"; if (voice) u.voice = voice; u.rate = 1.05;
    let shownOnce = false;
    const show = () => { if (!shownOnce) { shownOnce = true; onShow && onShow(); } };
    queue++; speaking = true; refreshUi();
    u.onstart = show;
    u.onend = u.onerror = () => {
      if (ep !== ttsEpoch) return;
      show();
      queue = Math.max(0, queue - 1);
      if (!queue) pump();
      if (!queue) { speaking = false; refreshUi(); if (!busy) revealAll(); maybeListenAgain(); scheduleWake(700); }
    };
    synth.speak(u);
  }
  function hush() { ttsEpoch++; if (synth) synth.cancel(); queue = 0; speaking = false; spokenUpTo = fullAnswer.length; revealAll(); refreshUi(); }

  // Fließend sprechen: immer nur ein Stück gleichzeitig, danach alles bis dahin Fertige in einem Rutsch
  let spokenUpTo = 0, genDone = false;
  function pump() {
    if (!voiceActive() || queue > 0) return;
    const rest = fullAnswer.slice(spokenUpTo);
    if (!rest.trim()) return;
    const words = t => t.trim().split(/\s+/).filter(Boolean).length;
    let cut = -1, m;
    if (genDone) cut = rest.length;
    else {
      const re = /[.!?…:;]+["»“)]?\s+|\n+/g;
      while ((m = re.exec(rest))) cut = m.index + m[0].length;
      if (cut < 0 && spokenUpTo === 0) {
        const rc = /,\s+/g;
        while ((m = rc.exec(rest))) if (words(rest.slice(0, m.index)) >= 5) cut = m.index + m[0].length;
      }
      if (cut < 0 && words(rest) >= 25) cut = rest.trimEnd().lastIndexOf(" ") + 1;
    }
    if (cut > 0) {
      const chunk = rest.slice(0, cut);
      spokenUpTo += cut;
      speak(chunk, () => reveal(chunk));
    }
  }

  /* ================= Mikrofon (Eingabe) ================= */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { setDot("micDot", "bad"); $("micV").textContent = "Nur in Edge oder Chrome verfügbar"; }
  else setDot("micDot", "ok");

  const PAUSES = [1500, 2500, 4000];
  let pauseMs = 2500;
  { const p = +lsGet("zg_pc_pause"); if (PAUSES.includes(p)) pauseMs = p; }

  function listen(keepText) {
    if (!SR) { note("Spracheingabe geht nur in Edge oder Chrome."); return; }
    if (busy || listening) return;
    stopWake();
    hush();
    rec = new SR();
    // Am PC hört der Browser durchgehend zu, auf Android klappt das nicht zuverlässig: dort wird bei Bedarf neu gestartet
    rec.lang = "de-DE"; rec.interimResults = true; rec.continuous = !IS_ANDROID; rec.maxAlternatives = 1;
    const before = keepText ? input.value.trim() + " " : "";
    let cancelled = false, stopRequested = false, lastSpeech = Date.now(), timer = null;
    const armTimer = () => {
      clearTimeout(timer);
      timer = setTimeout(() => { if (rec && input.value.trim()) { stopRequested = true; rec.stop(); } }, pauseMs);
    };
    rec.onresult = e => {
      let finalText = "", interim = "";
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += r[0].transcript + " "; else interim += r[0].transcript;
      }
      input.value = (before + finalText + interim).replace(/\s+/g, " ").trim();
      lastSpeech = Date.now();
      armTimer();
    };
    rec.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
        cancelled = true; loopOn = false; updateLoopUi();
        setDot("micDot", "bad");
        $("micV").textContent = e.error === "audio-capture" ? "Kein Mikrofon gefunden" : "Kein Zugriff aufs Mikrofon";
        note((e.error === "audio-capture"
          ? "Es wurde kein Mikrofon gefunden. Ist eins angeschlossen?"
          : e.error === "service-not-allowed"
          ? "Der Browser lässt die Spracherkennung nicht zu. Prüf in Windows: Einstellungen → Datenschutz → Spracherkennung → Online-Spracherkennung auf Ein."
          : !isSecureContext
          ? "Das Mikrofon geht nur über localhost oder die https-Adresse von Tailscale."
          : "Das Mikrofon ist blockiert. Tipp oben in der Adressleiste auf das Schloss-Symbol, stell Mikrofon auf „Zulassen“ und lade die Seite neu.")
          + " (Fehlercode: " + e.error + ")");
      } else if (e.error === "network") {
        cancelled = true; note("Die Spracherkennung braucht Internet. Prüf deine Verbindung.");
      } else if (e.error === "aborted") {
        cancelled = true;
      } else if (e.error === "no-speech") {
        cancelled = !input.value.trim();   // schon Gesagtes nicht wegwerfen
      }
    };
    rec.onend = () => {
      clearTimeout(timer);
      listening = false; rec = null; refreshUi();
      const t = input.value.trim();
      // Browser hat mitten im Satz aufgehört -> weiter zuhören (die Android-App erkennt das Satzende selbst)
      if (!AND && !cancelled && !stopRequested && t && Date.now() - lastSpeech < pauseMs) { listen(true); return; }
      if (!cancelled && t) { input.value = ""; ask(t, true); }
      else scheduleWake(400);
    };
    rec.userStop = () => { stopRequested = true; };
    listening = true; refreshUi();
    try { rec.start(); } catch { listening = false; refreshUi(); }
  }
  function stopListening(cancel) {
    if (!rec) return;
    if (cancel) { input.value = ""; rec.abort(); } else { rec.userStop(); rec.stop(); }
  }
  function maybeListenAgain() {
    if (loopOn && lastViaVoice && !busy && !speaking && !listening && ollamaOk) setTimeout(() => { if (!busy && !speaking && !listening) listen(); }, 350);
  }

  micBtn.onclick = () => {
    if (wakeRec) { stopWake(); listen(); return; }
    if (busy) { if (ctl) ctl.abort(); hush(); return; }
    if (speaking) { hush(); lastViaVoice = false; return; }
    if (listening) { stopListening(false); return; }
    listen();
  };
  document.addEventListener("keydown", e => {
    const tag = document.activeElement && document.activeElement.tagName;
    if (e.code === "Space" && !e.repeat && !["TEXTAREA", "INPUT", "BUTTON", "SELECT", "A"].includes(tag)) { e.preventDefault(); micBtn.click(); }
  });

  /* ================= Anzeige ================= */
  function refreshUi() {
    micBtn.classList.toggle("live", listening);
    micBtn.classList.toggle("busy", busy || speaking);
    $("micTitle").textContent = listening ? "ICH HÖRE ZU" : busy ? "STOPP" : speaking ? "STILL" : "SPRICH MIT MIR";
    $("micSub").textContent = listening ? "Sprich ruhig, klick wenn du fertig bist" : busy ? "Antwort abbrechen" : speaking ? "Vorlesen beenden" : (IS_ANDROID ? "Antippen" : "Klicken oder Leertaste");
    stateEl.textContent = listening ? "Hört zu …" : busy && !speaking ? "Denkt nach …" : speaking ? "Spricht …"
      : wakeHeard ? "Ja? Ich höre …" : (wakeOn && backend && !document.hidden) ? "Wartet auf „Hey Jarvis“" : "Bereit";
    $("cNew").disabled = busy;
  }
  function add(cls, text) {
    const el = document.createElement("div");
    el.className = cls; el.textContent = text; log.append(el);
    log.scrollTop = log.scrollHeight; return el;
  }
  const note = t => { const l = log.lastElementChild; if (l && l.className === "note" && l.textContent === t) return l; return add("note", t); };
  function renderChat() {
    log.textContent = "";
    if (!MINI) add("msg ai", GREETING);
    for (const m of messages) add(m.role === "user" ? "msg me" : "msg ai", m.content);
  }
  const fmt = ts => ts ? new Date(ts).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
  function renderList() {
    list.textContent = "";
    $("histCount").textContent = chats.length;
    if (!chats.length) { list.innerHTML = '<p class="empty">Noch keine Gespräche. Alles, was du sagst, wird automatisch gespeichert.</p>'; return; }
    for (const c of [...chats].sort((a, b) => b.updated - a.updated)) {
      const row = document.createElement("div");
      row.className = "item" + (c.id === currentId ? " active" : "");
      const open = document.createElement("button");
      open.type = "button"; open.className = "open";
      const t = document.createElement("span"); t.className = "t"; t.textContent = c.title;
      const d = document.createElement("span"); d.className = "d"; d.textContent = fmt(c.updated);
      open.append(t, d);
      open.onclick = () => { if (busy) return; hush(); stopListening(true); openChat(c); };
      const del = document.createElement("button");
      del.type = "button"; del.className = "del" + (armedDelete === c.id ? " confirm" : "");
      del.textContent = armedDelete === c.id ? "Wirklich?" : "Löschen";
      del.onclick = async () => {
        if (armedDelete !== c.id) { armedDelete = c.id; renderList(); return; }
        armedDelete = null;
        chats = chats.filter(x => x.id !== c.id);
        deleted.push({ id: c.id, ts: Date.now() }); saveLocal();
        if (serverStore) fetch("/data/chats/" + c.id, { method: "DELETE" }).catch(() => {});
        scheduleDriveSave();
        if (c.id === currentId) newChat(); else renderAll();
      };
      row.append(open, del); list.append(row);
    }
  }
  function renderStats() {
    const today = new Date().toDateString();
    let msgs = 0, todayN = 0;
    for (const c of chats) { msgs += c.messages.length; todayN += c.messages.filter(m => new Date(m.ts).toDateString() === today).length; }
    $("sChats").textContent = chats.length; $("sMsgs").textContent = msgs; $("sToday").textContent = todayN;
  }
  function renderAll() { renderList(); renderStats(); }
  function openChat(c) { currentId = c.id; messages = c.messages.map(m => ({ ...m })); pending = null; renderChat(); renderAll(); }
  function newChat() {
    if (busy) return;
    hush(); stopListening(true);
    currentId = null; messages = []; pending = null; renderChat(); renderAll();
  }


  /* ================= „Hey Jarvis“: wartet auf das Aktivierungswort, solange die App offen ist ================= */
  const WAKE_RE = /\b(?:hey|hei|hej|he|hi|hallo|ey|äh)[\s,.!]*(?:jarvis|javis|jarwis|jarvin|jervis|dschawis+|dschawiss|tscharwis|tschawis|charvis|schaffis|jarvi)\b/i;
  let wakeOn = lsGet("zg_wake") === "1", wakeRec = null, wakeHeard = false, wakeTimer = null, screenLock = null;
  function beep() {
    try {
      const a = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
      if (a.state === "suspended") a.resume();
      const o = a.createOscillator(), g = a.createGain();
      o.frequency.value = 880; g.gain.setValueAtTime(.15, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .18);
      o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + .2);
    } catch {}
  }
  const canWake = () => wakeOn && SR && backend && !busy && !speaking && !listening && !wakeRec && !document.hidden;
  function scheduleWake(ms) { clearTimeout(wakeTimer); if (wakeOn) wakeTimer = setTimeout(startWake, ms); }
  function stopWake() {
    clearTimeout(wakeTimer);
    if (wakeRec) { const r = wakeRec; wakeRec = null; wakeHeard = false; r.onend = null; try { r.abort(); } catch {} refreshUi(); }
  }
  function startWake() {
    if (AND || !canWake()) return;
    const r = new SR(); wakeRec = r; wakeHeard = false;
    r.lang = "de-DE"; r.interimResults = true; r.continuous = !IS_ANDROID; r.maxAlternatives = 1;
    let cmd = "", t = null;
    r.onresult = e => {
      let txt = "";
      for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript + " ";
      const m = WAKE_RE.exec(txt);
      if (!m) return;
      if (!wakeHeard) { wakeHeard = true; beep(); refreshUi(); }
      cmd = txt.slice(m.index + m[0].length).replace(/^[\s,.!?]+/, "").trim();
      input.value = cmd;
      clearTimeout(t);
      t = setTimeout(() => { try { r.stop(); } catch {} }, cmd ? pauseMs : 1500);
    };
    r.onerror = e => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
        wakeOn = false; lsSet("zg_wake", "0"); updateWakeUi();
        note("„Hey Jarvis“ braucht Zugriff aufs Mikrofon. Erlaube es oben in der Adressleiste und schalte es dann wieder an.");
      }
    };
    r.onend = () => {
      clearTimeout(t);
      const heard = wakeHeard;
      wakeRec = null; wakeHeard = false; refreshUi();
      if (heard) { input.value = ""; if (cmd) ask(cmd, true); else listen(); return; }
      scheduleWake(IS_ANDROID ? 250 : 400);
    };
    try { r.start(); } catch { wakeRec = null; scheduleWake(1500); }
    refreshUi();
  }
  async function lockScreen() {
    if (!wakeOn || document.hidden || !("wakeLock" in navigator) || screenLock) return;
    try { screenLock = await navigator.wakeLock.request("screen"); screenLock.addEventListener("release", () => { screenLock = null; }); } catch {}
  }
  function updateWakeUi() {
    $("cWakeState").textContent = wakeOn ? "AN" : "AUS";
    if (!wakeOn) { stopWake(); if (screenLock) { screenLock.release().catch(() => {}); screenLock = null; } }
    refreshUi();
  }
  $("cWake").onclick = () => {
    if (AND) {   // Android-App: ein Dienst hört im Hintergrund, auch wenn die App zu ist
      wakeOn = !wakeOn; lsSet("zg_wake", wakeOn ? "1" : "0"); AND.wakeSet(wakeOn); updateWakeUi();
      if (wakeOn) { beep(); note("„Hey Jarvis“ ist an – auch im Hintergrund. Oben in der Benachrichtigungsleiste siehst du, dass die App wartet."); }
      return;
    }
    if (!SR) { note("„Hey Jarvis“ geht nur in Chrome oder Edge."); return; }

  /* ---------- Kleiner Kreis: schließt sich von selbst, wenn nichts mehr passiert ---------- */
  function startMiniWatch() {
    let lastActive = Date.now(), hadTalk = false;
    const opened = Date.now();
    setInterval(() => {
      const active = busy || speaking || listening;
      if (active) { lastActive = Date.now(); hadTalk = true; return; }
      const idle = Date.now() - lastActive;
      if (pending) { if (idle > 20000) AND.miniClose(); return; }              // Rückfrage offen: etwas länger warten
      if (hadTalk && idle > 2500) AND.miniClose();                             // fertig
      else if (!hadTalk && Date.now() - opened > 9000) AND.miniClose();        // nie etwas gehört
    }, 500);

  async function checkGemini() {
    if (!geminiKey) return false;
    if (geminiModel) return true;
    try {
      const r = await fetch(`${GEM}/models?pageSize=200`, { headers: { "x-goog-api-key": geminiKey } });
      if (!r.ok) throw new Error(r.status);
      const ms = ((await r.json()).models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name);
      const ver = n => { const m = /gemini-(\d+(?:\.\d+)?)/.exec(n); return m ? parseFloat(m[1]) : 0; };
      // Reihenfolge: stabile Flash-Modelle (neueste zuerst), dann Vorschau-Versionen, dann Flash-Lite als Notlösung
      const bad = /image|tts|audio|live|embed|thinking|computer|robotics/;
      const pre = n => /preview|exp/.test(n) ? 1 : 0;
      const sortV = arr => arr.sort((a, b) => (pre(a) - pre(b)) || (ver(b) - ver(a)) || a.length - b.length);
      const flash = sortV(ms.filter(n => /flash/.test(n) && !/lite/.test(n) && !bad.test(n)));
      const lite = sortV(ms.filter(n => /flash-lite/.test(n) && !bad.test(n)));
      geminiCandidates = [...flash, ...lite];
      if (!geminiCandidates.length) geminiCandidates = ["models/gemini-2.5-flash"];
      const remembered = lsGet("zg_gem_model");
      geminiModel = geminiCandidates.includes(remembered) ? remembered : geminiCandidates[0];
      return true;
    } catch { geminiModel = null; return false; }
  }

  // Nachrichten ins Gemini-Format bringen (system -> systemInstruction, assistant -> model)
  function toGemini(msgs) {
    const sys = msgs.filter(m => m.role === "system").map(m => m.content).join("\n\n");
    const contents = [];
    for (const m of msgs) {
      if (m.role === "system") continue;
      const role = m.role === "assistant" ? "model" : "user";
      const last = contents[contents.length - 1];
      if (last && last.role === role) last.parts[0].text += "\n\n" + m.content;
      else contents.push({ role, parts: [{ text: m.content }] });
    }
    while (contents.length && contents[0].role !== "user") contents.shift();
    const body = { contents };
    if (sys) body.systemInstruction = { parts: [{ text: sys }] };
    return body;
  }
  async function gemFetchOne(modelName, path, body, signal) {
    const url = `${GEM}/${modelName}:${path}`;
    const headers = { "Content-Type": "application/json", "x-goog-api-key": geminiKey };
    // zuerst mit wenig "Nachdenken" (schneller), falls das Modell das nicht kennt: ohne
    const withThink = { ...body, generationConfig: { ...(body.generationConfig || {}), thinkingConfig: { thinkingLevel: "low" } } };
    let r = await fetch(url, { method: "POST", signal, headers, body: JSON.stringify(withThink) });
    if (r.status === 400) {
      const t = await r.clone().text();
      if (/thinking/i.test(t)) r = await fetch(url, { method: "POST", signal, headers, body: JSON.stringify(body) });
    }
    return r;
  }
  // Probiert das aktuelle Modell; ist es überlastet oder das Limit erreicht, automatisch das nächste
  async function gemFetch(path, body, signal) {
    const order = [geminiModel, ...geminiCandidates.filter(m => m !== geminiModel)];
    let lastStatus = 0, lastText = "";
    for (let i = 0; i < order.length && i < 5; i++) {
      const m = order[i];
      const r = await gemFetchOne(m, path, body, signal);
      if (r.ok) {
        if (m !== geminiModel) { geminiModel = m; lsSet("zg_gem_model", m); if (backend === "gemini") $("aiV").textContent = "Gemini (immer an) · " + m.replace("models/", ""); }
        return r;
      }
      lastStatus = r.status; lastText = await r.text();
      const overloaded = r.status === 503 || r.status === 500 || r.status === 429 || r.status === 404 || /high demand|overloaded|unavailable/i.test(lastText);
      if (!overloaded) break;
    }
    throw new Error(gemError(lastStatus, lastText));
  }
  function gemError(status, text) {
    if (/high demand|overloaded|unavailable/i.test(text) || status === 503) return "Gemini ist gerade überlastet (alle Modelle). Versuch es in ein paar Minuten nochmal oder stell „KI-Quelle“ auf PC.";
    if (status === 429) return "Das kostenlose Gemini-Limit ist gerade erreicht. Später nochmal oder auf die PC-KI umschalten.";
    if (status === 400 && /API key/i.test(text)) return "Der Gemini-Schlüssel ist ungültig.";
    if (status === 403) return "Gemini lehnt den Schlüssel ab (403).";
    try { return JSON.parse(text).error.message; } catch { return "Gemini-Fehler " + status; }
  }

  // Antwort Stück für Stück holen; onPiece bekommt jeweils den neuen Text
  async function llmStream(msgs, onPiece, signal) {
    if (backend === "gemini") {
      const r = await gemFetch("streamGenerateContent?alt=sse", { ...toGemini(msgs), generationConfig: { temperature: 0.7, maxOutputTokens: 1024 } }, signal);
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split("\n"); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith("data:")) continue;
          const j = JSON.parse(line.slice(5));
          const parts = (j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || [];
          const piece = parts.filter(p => !p.thought).map(p => p.text || "").join("");
          if (piece) onPiece(piece);
        }
      }
      return;
    }
    const r = await fetch(OLLAMA + "/api/chat", {
      method: "POST", signal,
      body: JSON.stringify({ model, stream: true, keep_alive: "60m", options: { num_ctx: 2048 }, messages: msgs }),
    });
    if (!r.ok) throw new Error((await r.text()) || ("Fehler " + r.status));
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const j = JSON.parse(line);
        if (j.error) throw new Error(j.error);
        const piece = j.message && j.message.content || "";
        if (piece) onPiece(piece);
      }
    }
  }
  // Antwort als JSON (für Termine, Mails usw.)
  async function llmJson(prompt, schema) {
    if (backend === "gemini") {
      const r = await gemFetch("generateContent", {
        contents: [{ role: "user", parts: [{ text: prompt + "\n\nAntworte nur mit einem JSON-Objekt nach diesem Schema, ohne weiteren Text:\n" + JSON.stringify(schema) }] }],
        generationConfig: { temperature: 0, responseMimeType: "application/json" },
      });
      const j = await r.json();
      const txt = ((j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts) || []).filter(p => !p.thought).map(p => p.text || "").join("");
      const m = /\{[\s\S]*\}/.exec(txt);
      return JSON.parse(m ? m[0] : txt);
    }
    const r = await fetch(OLLAMA + "/api/chat", {
      method: "POST",
      body: JSON.stringify({ model, stream: false, format: schema, keep_alive: "60m", options: { num_ctx: 2048, temperature: 0 }, messages: [{ role: "user", content: prompt }] }),
    });
    if (!r.ok) throw new Error(await r.text());
    return JSON.parse((await r.json()).message.content);
  }

  // Eine KI-Antwort erzeugen, gleichzeitig vorlesen und speichern
  async function streamReply(modelMessages) {
    const bubble = add("msg ai wait", "Denkt nach …");
    bubbleEl = bubble; shown = ""; fullAnswer = "";
    busy = true; spokenUpTo = 0; genDone = false; refreshUi();
    const saving = persist();
    ctl = new AbortController();
    let full = "";
    try {
      await llmStream(modelMessages, piece => {
        full += piece; fullAnswer = full;
        if (!voiceActive()) { bubble.classList.remove("wait"); bubble.textContent = full; log.scrollTop = log.scrollHeight; }
        genDone = false; pump();
      }, ctl.signal);
      genDone = true; pump();
    } catch (e) {
      if (e && e.name === "AbortError") { lastViaVoice = false; }
      else { lastViaVoice = false; note("Die KI hat einen Fehler gemeldet: " + (e && e.message || e)); }
      if (!full) bubble.remove(); else revealAll();
    }
    await saving;
    if (full.trim()) { messages.push({ role: "assistant", content: full.trim(), ts: Date.now() }); await persist(); }
    ctl = null; busy = false; refreshUi();
    if (!speaking) { revealAll(); maybeListenAgain(); scheduleWake(700); }
  }

  // Eine feste Antwort (ohne KI) sprechen, anzeigen und speichern
  function assistantSay(text, silent) {
    const b = add("msg ai wait", "…");
    bubbleEl = b; shown = ""; fullAnswer = text; spokenUpTo = 0; genDone = true;
    if (voiceActive() && !silent) pump(); else revealAll();
    messages.push({ role: "assistant", content: text, ts: Date.now() });
    persist();
  }

  async function ask(text, viaVoice) {
    if (!backend) { await checkAi(); if (!backend) { note("Keine KI erreichbar. Tipp links auf „KI-Quelle“ oder starte den PC."); return; } }
    lastViaVoice = viaVoice;
    hush();
    add("msg me", text);
    messages.push({ role: "user", content: text, ts: Date.now() });
    if (await handleActions(text)) { if (!speaking && !busy) { maybeListenAgain(); scheduleWake(700); } return; }
    const ctx = messages.slice(-10).map(m => ({ role: m.role, content: m.content }));
    await streamReply([{ role: "system", content: RULES() }, ...ctx]);
  }

  /* ================= Google (Kalender, Gmail, Kontakte) ================= */
  const G_SCOPES = [
    "https://www.googleapis.com/auth/calendar.events",
    "https://www.googleapis.com/auth/gmail.readonly",
    "https://www.googleapis.com/auth/gmail.compose",

  function loadGis() {
    if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
    return new Promise((res, rej) => {
      const sc = document.createElement("script");
      sc.src = "https://accounts.google.com/gsi/client"; sc.async = true;

      document.head.append(sc);

  function tokenReceived(tok, seconds) {
    gToken = tok; gTokenExp = Date.now() + seconds * 1000;
    lsSet("zg_g_ok", "1");
    try { sessionStorage.setItem("zg_g_token", JSON.stringify({ token: gToken, exp: gTokenExp })); } catch {}
    updateGoogleUi();
    driveSync(true).then(() => { const c = chats.find(x => x.id === currentId); if (c && c.messages.length !== messages.length && !busy && !speaking) openChat(c); });
  }
  async function getToken(silent) {
    if (gToken && Date.now() < gTokenExp - 60000) return gToken;
    if (AND) {   // in der Android-App meldet die App selbst bei Google an
      return new Promise((res, rej) => {
        window.__zgGoogle = { emit(ev) { if (ev.token) { tokenReceived(ev.token, 50 * 60); res(gToken); } else rej(new Error(ev.error || "Google-Anmeldung fehlgeschlagen")); } };
        if (silent && AND.googleTokenSilent) AND.googleTokenSilent(G_SCOPES.join(" ")); else AND.googleToken(G_SCOPES.join(" "));
      });
    }
    if (!gClientId) throw new Error("Google ist noch nicht eingerichtet");
    await loadGis();
    if (!tokenClient) tokenClient = google.accounts.oauth2.initTokenClient({ client_id: gClientId, scope: G_SCOPES.join(" "), callback: () => {} });
    return new Promise((res, rej) => {
      tokenClient.callback = r => {
        if (r.error) return rej(new Error(r.error_description || r.error));
        if (!google.accounts.oauth2.hasGrantedAllScopes(r, ...G_SCOPES)) note("Hinweis: Du hast nicht alle Google-Rechte erlaubt. Manche Funktionen gehen dann nicht.");
        gToken = r.access_token; gTokenExp = Date.now() + (r.expires_in || 3600) * 1000;
        try { sessionStorage.setItem("zg_g_token", JSON.stringify({ token: gToken, exp: gTokenExp })); } catch {}
        updateGoogleUi(); res(gToken);
        driveSync(true).then(() => { const c = chats.find(x => x.id === currentId); if (c && c.messages.length !== messages.length && !busy && !speaking) openChat(c); });
      };
      tokenClient.error_callback = e => rej(new Error(e && e.type === "popup_closed" ? "Anmeldefenster geschlossen" : "Anmeldung blockiert. Klick links auf „Google verbinden“."));
      tokenClient.requestAccessToken({ prompt: "" });
    });
  }
  async function gApi(url, opts = {}) {
    const token = await getToken();
    const r = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + token, "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (r.status === 401) { gToken = null; try { sessionStorage.removeItem("zg_g_token"); } catch {} updateGoogleUi(); throw new Error("Die Google-Anmeldung ist abgelaufen. Klick links auf „Google verbinden“."); }
    if (!r.ok) { let m = "Fehler " + r.status; try { m = (await r.json()).error.message; } catch {} throw new Error(m); }
    return r.status === 204 ? null : r.json();
  }

  /* ---------- Google Drive: alle Chats als eine Datei, auf allen Geräten gleich ---------- */
  const DRIVE_NAME = "Zweites Gehirn Chats.json";
  let driveTimer = null, driveBusy = false;
  function driveReady() { return !!(gToken && Date.now() < gTokenExp - 30000); }
  function scheduleDriveSave() { if (!driveReady()) return; clearTimeout(driveTimer); driveTimer = setTimeout(() => driveSync(true), 1500); }
  async function driveFileId() {
    let id = lsGet("zg_drive_file");
    if (id) return id;
    const q = encodeURIComponent(`name='${DRIVE_NAME}' and trashed=false`);
    const r = await gApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&spaces=drive`);
    id = r.files && r.files[0] && r.files[0].id || "";
    if (id) lsSet("zg_drive_file", id);
    return id;
  }
  async function driveSync(write) {
    if (!driveReady() || driveBusy) return;
    driveBusy = true;
    try {
      let id = await driveFileId();
      if (id) {
        let remote = null;
        try { remote = await gApi(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`); }
        catch (e) { if (/404|not found/i.test(e.message)) { lsSet("zg_drive_file", ""); id = ""; } else throw e; }
        if (remote) {
          const before = new Map(chats.map(c => [c.id, c.updated]));
          mergeInto(remote.chats, remote.deleted);
          saveLocal(); renderAll();

  const needGoogle = () => { assistantSay("Dafür muss Google erst verbunden sein. Die Anleitung liegt in deinem Ordner unter „Google einrichten“. Danach klickst du links auf „Google verbinden“."); return true; };

  /* ---------- Was will der Nutzer? ---------- */
  const ACTION_RE = /termin|kalender|eintrag|trag\b.*\bein\b|trage\b|erinner|verabred|was (hab|habe|hast|steht)|welche termine|hab ich (heute|morgen|am|nächste)|mail|posteingang|postfach|kontakt|nummer|telefon|adresse von|schreib\b.*\ban\b/i;
  function dayTable() {
    const now = new Date(); let t = "";
    for (let i = 0; i < 14; i++) { const d = new Date(now); d.setDate(now.getDate() + i); t += `${i === 0 ? "heute" : i === 1 ? "morgen" : i === 2 ? "übermorgen" : WD[d.getDay()]}: ${ymd(d)} (${WD[d.getDay()]})\n`; }
    return t;

  async function extractAction(text) {
    const now = new Date();
    const prompt = `Heute ist ${WD[now.getDay()]}, der ${ymd(now)}, es ist ${pad(now.getHours())}:${pad(now.getMinutes())} Uhr.
Die nächsten Tage:
${dayTable()}
Ordne die Nachricht des Nutzers genau einer Aktion zu:
- "termin_erstellen": er will einen Termin eintragen oder an etwas erinnert werden. titel kurz (2 bis 5 Wörter, ohne Datum), datum JJJJ-MM-TT, uhrzeit HH:MM (leer, wenn keine genannt), dauer_minuten (Standard 60).

    const schema = {

  const YES = /^\s*(ja|jo|jep|jawohl|genau|klar|okay|ok|passt|mach( das)?|bitte|speicher|trag( es)? ein)\b/i;

  /* ---------- Anrufen (nur Android-App): „Ruf Papa an“ ---------- */
  const CALL_RES = [
    /^(?:bitte\s+)?(?:ruf|rufe)\s+(?:bitte\s+)?(?:mal\s+)?(.+?)\s+an\b/i,
    /^(?:bitte\s+)?(?:kannst du\s+)?(.+?)\s+anrufen\b/i,
    /^(?:bitte\s+)?(?:anruf|anrufen)\s+(?:bei\s+)?(.+?)$/i,
    /^(?:bitte\s+)?telefonier\w*\s+(?:mit\s+)?(.+?)$/i,
  ];
  function callTarget(text) {
    const t = text.trim().replace(/[.!?]+$/, "");
    for (const re of CALL_RES) {
      const m = re.exec(t);
      if (m) return m[1].replace(/^(?:meine[nmrs]?|mein|den|die|der|dem)\s+/i, "").trim();
    }
    return null;
  }
  const norm = x => (x || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
  function handleCall(text) {
    const who = callTarget(text);
    if (!who) return false;
    if (!AND) { assistantSay("Anrufen geht nur in der Android-App auf deinem Handy."); return true; }
    if (!AND.phoneReady()) {
      AND.requestPhone();

    let list = [];
    try { list = JSON.parse(AND.findContacts(who)); } catch {}
    if (!list.length) { assistantSay(`Ich finde „${who}“ nicht in deinen Kontakten.`); return true; }
    const q = norm(who);
    const names = [...new Set(list.map(c => c.name))];
    let name = names.find(n => norm(n) === q) || (names.length === 1 ? names[0] : null) || names.find(n => norm(n).startsWith(q + " ") || norm(n).split(" ").includes(q));
    if (!name) { assistantSay(`Ich habe mehrere gefunden: ${names.slice(0, 3).join(", ")}. Sag bitte den genauen Namen, zum Beispiel: ruf ${names[0]} an.`); return true; }
    const nums = list.filter(c => c.name === name);
    const pick = nums.find(c => c.primary) || nums.find(c => c.mobile) || nums[0];

      if (speaking) { setTimeout(waitThenCall, 200); return; }
