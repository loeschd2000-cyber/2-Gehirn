<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · SmartThings</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #040b16; color: #e6f4ff; font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  .c { max-width: 420px; text-align: center; }
  a { display: inline-block; margin-top: 18px; padding: 14px 22px; border-radius: 14px; background: #1aa7e8; color: #fff; text-decoration: none; font-weight: 600; }
  .e { color: #ffb4b4; }
</style>
</head>
<body>
<div class="c">
  <h2>SmartThings → Jarvis</h2>
  <p id="t">Zurück zu Jarvis …</p>
  <a id="go" href="#" hidden>Zurück zu Jarvis</a>
</div>
<script>
  // Diese Seite nimmt die Antwort von SmartThings entgegen und gibt sie an die Jarvis-App weiter.
  var q = new URLSearchParams(location.search);
  var code = q.get("code") || "", state = q.get("state") || "", err = q.get("error") || "";
  var t = document.getElementById("t"), go = document.getElementById("go");
  if (err || !code) { t.textContent = "Die Anmeldung wurde abgebrochen" + (err ? " (" + err + ")" : "") + ". Du kannst dieses Fenster schließen."; t.className = "e"; }
  else {
    var url = "zweitesgehirn://smartthings-callback?code=" + encodeURIComponent(code) + "&state=" + encodeURIComponent(state);
    go.href = url; go.hidden = false;
    t.textContent = "Fertig! Falls sich Jarvis nicht von selbst öffnet, tipp auf den Knopf.";
    setTimeout(function () { location.href = url; }, 300);
  }
</script>
</body>
</html>
